  #   env_file: ../.env
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # crumb-worker:
  #   profiles: [crumb, full]
  #   image: biznicesweets/crumb:latest
  #   env_file: ../.env
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # gelato-worker:
  #   profiles: [gelato, full]
  #   image: biznicesweets/gelato:latest
  #   env_file: ../.env
  #   depends_on:
  #     db:
  #       condition: service_healthy

  # crisp-worker:
  #   profiles: [crisp, full]
