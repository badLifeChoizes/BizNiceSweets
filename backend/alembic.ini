# alembic.ini — Alembic configuration for BizNiceSweets
#
# NOTE: sqlalchemy.url is intentionally NOT set here (T-01-02 / D-03).
# The database URL is injected at runtime in alembic/env.py from the
# pydantic-settings Settings object, which reads it from environment
# variables / .env. This prevents credentials from being committed to
# the repository.

[alembic]
# Path to migration scripts, relative to the location of this .ini file
script_location = alembic

# Template used to generate new migration files
file_template = %%(rev)s_%%(slug)s

# Timezone used when generating the Create Date value in migration files
# (leave blank to use local time)
timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Prepend the invocation directory to sys.path so `import app...` resolves the
# app package both locally (run from backend/) and in the container (WORKDIR
# /app). Without this, `alembic upgrade head` fails with ModuleNotFoundError:
# the alembic console script does not add its cwd to sys.path the way uvicorn
# and pytest do.
prepend_sys_path = .

# A generic, single database configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
