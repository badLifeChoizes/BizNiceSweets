[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # Use X | Y instead of Optional[X] (keeping Union for clarity in type stubs)
]
