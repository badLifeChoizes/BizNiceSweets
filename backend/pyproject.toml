[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "po_number: pure PO-number generator (digit-boundary) tests — no DB (Phase 8, Task 15)",
    "fsm: pure PO status FSM (PO_TRANSITIONS) tests — no DB (Phase 8, Task 16)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # Use X | Y instead of Optional[X] (keeping Union for clarity in type stubs)
]
