function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('modalContainer').innerHTML = '';
    renderAll();
}

function switchEditTab(tab, btn) {
    document.querySelectorAll('[id^="editTab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById('editTab-' + tab).classList.remove('hidden');
    btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function switchImportTab(tab, btn) {
    document.querySelectorAll('[id^="importTab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById('importTab-' + tab).classList.remove('hidden');
    btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function saveNewPart() {
    const name = document.getElementById('newPartName').value.trim();
    if (!name) { alert('Name is required'); return; }
    
    Parts.create({
        partNumber: document.getElementById('newPartNumber').value.trim(),
        name: name,
        type: document.getElementById('newPartType').value,
        category: document.getElementById('newPartCategory').value.trim(),
        costLow: document.getElementById('newCostLow').value,
        costHigh: document.getElementById('newCostHigh').value,
        costAvg: document.getElementById('newCostAvg').value,
        notes: document.getElementById('newPartNotes').value.trim(),
        isProduct: document.getElementById('newIsProduct').checked
    });
    
    closeModal();
}

function saveEditPart(id) {
    Parts.update(id, {
        // partNumber is readonly - don't update it
        legacyPartNumber: document.getElementById('editLegacyPartNumber').value.trim() || null,
        name: document.getElementById('editPartName').value.trim(),
        type: document.getElementById('editPartType').value,
        category: document.getElementById('editPartCategory').value.trim(),
        status: document.getElementById('editPartStatus').value,
        revision: document.getElementById('editPartRevision').value.trim(),
        notes: document.getElementById('editPartNotes').value.trim(),
        isProduct: document.getElementById('editIsProduct').checked,
        cost: parseFloat(document.getElementById('editCost').value) || 0,
        costedDate: document.getElementById('editCostedDate').value || null,
        costLow: parseFloat(document.getElementById('editCostLow').value) || 0,
        costHigh: parseFloat(document.getElementById('editCostHigh').value) || 0,
        costAvg: parseFloat(document.getElementById('editCostAvg').value) || 0
    });
    
    closeModal();
}

function showAddToBomModal(parentId) {
    const parent = Parts.getById(parentId);
    if (!parent) return;
    
    // Store parent ID for later use
    window._addToBomParentId = parentId;
    window._addToBomSearchTerm = '';
    window._addToBomMode = 'existing'; // 'existing' or 'new'
    
    renderAddToBomModal();
}

function renderAddToBomModal() {
    const parentId = window._addToBomParentId;
    const parent = Parts.getById(parentId);
    const searchTerm = window._addToBomSearchTerm || '';
    const mode = window._addToBomMode || 'existing';
    
    // Get parts not already in BOM
    const existingIds = new Set((parent.bom || []).map(b => b.partId));
    let available = DB.parts.filter(p => p.id !== parentId && !existingIds.has(p.id));
    
    // Filter by search term
    if (searchTerm) {
        const term = searchTerm.toLowerCase();
        available = available.filter(p => 
            p.partNumber.toLowerCase().includes(term) ||
            p.name.toLowerCase().includes(term) ||
            (p.legacyPartNumber || '').toLowerCase().includes(term)
        );
    }
    
    // Limit display for performance
    const displayParts = available.slice(0, 50);
    const hasMore = available.length > 50;
    
    const existingPartHtml = `
        <div class="form-group">
            <label class="form-label">Search Parts</label>
            <div class="search-box" style="margin-bottom:12px">
                <span class="search-icon">🔍</span>
                <input type="text" class="form-input" id="addToBomSearch" 
                    placeholder="Search by part number, name, or legacy PN..." 
                    value="${Utils.escapeHtml(searchTerm)}"
                    oninput="window._addToBomSearchTerm = this.value; renderAddToBomModal()">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Select Part <span style="color:var(--text-muted);font-weight:normal">(${available.length} available)</span></label>
            <div style="max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
                ${displayParts.length === 0 
                    ? `<div style="padding:24px;text-align:center;color:var(--text-muted)">
                        ${searchTerm ? 'No parts match your search' : 'No parts available to add'}
                        <br><br>
                        <button class="btn btn-sm" onclick="window._addToBomMode='new';renderAddToBomModal()">➕ Create New Part</button>
                       </div>`
                    : displayParts.map(p => {
                        const hasBom = p.bom && p.bom.length > 0;
                        return `
                        <div class="selectable-part-row" onclick="selectPartForBom('${p.id}')" data-id="${p.id}">
                            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
                                ${hasBom ? '<span class="tag tag-assy" style="padding:1px 4px;font-size:9px">ASSY</span>' : ''}
                                <span class="mono" style="color:var(--accent);font-size:12px">${Utils.escapeHtml(p.partNumber)}</span>
                                <span style="color:var(--text-muted);font-size:11px">${p.legacyPartNumber ? '(' + Utils.escapeHtml(p.legacyPartNumber) + ')' : ''}</span>
                            </div>
                            <div style="flex:2;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.escapeHtml(p.name)}</div>
                            <div class="mono" style="font-size:12px;color:var(--success)">${Utils.formatCurrency(Parts.getEffectiveCost(p))}</div>
                        </div>
                    `}).join('')}
                ${hasMore ? `<div style="padding:8px;text-align:center;color:var(--text-muted);font-size:12px;background:var(--bg-tertiary)">Showing first 50 of ${available.length} results. Refine your search to see more.</div>` : ''}
            </div>
        </div>
        
        <div class="form-group" id="selectedPartInfo" style="display:none;background:var(--bg-tertiary);padding:12px;border-radius:6px;margin-top:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div style="font-weight:600" id="selectedPartName">-</div>
                    <div style="font-size:12px;color:var(--text-muted)" id="selectedPartNumber">-</div>
                </div>
                <button class="btn btn-sm" onclick="clearPartSelection()">✕ Clear</button>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Quantity</label>
            <input type="number" min="1" class="form-input" id="addToBomQty" value="1" style="width:100px">
        </div>
    `;
    
    const newPartHtml = `
        <div style="background:var(--bg-tertiary);padding:12px;border-radius:6px;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:18px">✨</span>
                <div>
                    <div style="font-weight:600">Create New Part</div>
                    <div style="font-size:12px;color:var(--text-muted)">This will add a new part to the database AND to this BOM</div>
                </div>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Part Number <span style="color:var(--text-muted);font-weight:normal">(optional)</span></label>
                <input type="text" class="form-input" id="newPartNumber" placeholder="Auto-generated if empty">
            </div>
            <div class="form-group">
                <label class="form-label">Legacy PN <span style="color:var(--text-muted);font-weight:normal">(optional)</span></label>
                <input type="text" class="form-input" id="newPartLegacyPN" placeholder="From old system">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label required">Name / Description</label>
            <input type="text" class="form-input" id="newPartName" placeholder="Part name or description">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Type</label>
                <select class="form-select" id="newPartType">
                    <option value="PP">PP - Purchased Part</option>
                    <option value="SA">SA - Sub-Assembly</option>
                    <option value="MD">MD - Manufactured</option>
                    <option value="HS">HS - Hardware/Standard</option>
                    <option value="UP">UP - Unassigned</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <input type="text" class="form-input" id="newPartCategory" placeholder="e.g., HEAD, TORSO">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Estimated Cost</label>
                <input type="number" step="0.01" class="form-input" id="newPartCost" placeholder="0.00">
            </div>
            <div class="form-group">
                <label class="form-label">Quantity in BOM</label>
                <input type="number" min="1" class="form-input" id="newPartQty" value="1">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Notes <span style="color:var(--text-muted);font-weight:normal">(optional)</span></label>
            <input type="text" class="form-input" id="newPartNotes" placeholder="Any additional notes">
        </div>
    `;
    
    const html = `
        <div class="modal-backdrop" onclick="closeAddToBomModal(event)" style="z-index:1001">
            <div class="modal modal-lg" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h2 class="modal-title">Add Part to: ${Utils.escapeHtml(parent.partNumber)}</h2>
                    <button class="modal-close" onclick="closeAddToBomModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="tabs" style="margin-bottom:16px">
                        <button class="tab ${mode === 'existing' ? 'active' : ''}" onclick="window._addToBomMode='existing';renderAddToBomModal()">
                            📦 Existing Part
                        </button>
                        <button class="tab ${mode === 'new' ? 'active' : ''}" onclick="window._addToBomMode='new';renderAddToBomModal()">
                            ✨ Create New Part
                        </button>
                    </div>
                    
                    ${mode === 'existing' ? existingPartHtml : newPartHtml}
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeAddToBomModal()">Cancel</button>
                    ${mode === 'existing' 
                        ? `<button class="btn btn-primary" onclick="confirmAddExistingToBom('${parentId}')">➕ Add to BOM</button>`
                        : `<button class="btn btn-primary" onclick="confirmAddNewPartToBom('${parentId}')">✨ Create & Add</button>`
                    }
                </div>
            </div>
        </div>
    `;
    
    // Remove existing modal if present
    const existingModal = document.querySelector('.modal-backdrop[style*="z-index:1001"]');
    if (existingModal) existingModal.remove();
    
    document.getElementById('modalContainer').insertAdjacentHTML('beforeend', html);
    
    // Focus search input if in existing mode
    if (mode === 'existing') {
        setTimeout(() => {
            const searchInput = document.getElementById('addToBomSearch');
            if (searchInput) searchInput.focus();
        }, 100);
    }
}

// Store selected part
window._selectedPartForBom = null;

function selectPartForBom(partId) {
    window._selectedPartForBom = partId;
    const part = Parts.getById(partId);
    
    // Update visual selection
    document.querySelectorAll('.selectable-part-row').forEach(row => {
        row.classList.toggle('selected', row.dataset.id === partId);
    });
    
    // Show selected part info
    const infoDiv = document.getElementById('selectedPartInfo');
    if (infoDiv && part) {
        infoDiv.style.display = 'block';
        document.getElementById('selectedPartName').textContent = part.name;
        document.getElementById('selectedPartNumber').textContent = `${part.partNumber} • ${Utils.formatCurrency(Parts.getEffectiveCost(part))}`;
    }
}

function clearPartSelection() {
    window._selectedPartForBom = null;
    document.querySelectorAll('.selectable-part-row').forEach(row => row.classList.remove('selected'));
    const infoDiv = document.getElementById('selectedPartInfo');
    if (infoDiv) infoDiv.style.display = 'none';
}

function closeAddToBomModal(event) {
    if (event && event.target !== event.currentTarget) return;
    const modals = document.querySelectorAll('.modal-backdrop');
    if (modals.length > 1) modals[modals.length - 1].remove();
    // Clear state
    window._selectedPartForBom = null;
    window._addToBomSearchTerm = '';
}

function confirmAddExistingToBom(parentId) {
    const childId = window._selectedPartForBom;
    const qty = parseInt(document.getElementById('addToBomQty').value) || 1;
    
    if (!childId) { 
        showToast('Please select a part first', 'warning'); 
        return; 
    }
    
    Parts.addToBom(parentId, childId, qty);
    closeAddToBomModal();
    showToast('Part added to BOM', 'success');
    showModal('bomEditor', parentId);
}

function confirmAddNewPartToBom(parentId) {
    const name = document.getElementById('newPartName').value.trim();
    const partNumber = document.getElementById('newPartNumber').value.trim();
    const legacyPN = document.getElementById('newPartLegacyPN').value.trim();
    const type = document.getElementById('newPartType').value;
    const category = document.getElementById('newPartCategory').value.trim();
    const cost = parseFloat(document.getElementById('newPartCost').value) || 0;
    const qty = parseInt(document.getElementById('newPartQty').value) || 1;
    const notes = document.getElementById('newPartNotes').value.trim();
    
    if (!name) {
        showToast('Please enter a part name', 'warning');
        return;
    }
    
    // Create the new part
    const newPart = Parts.create({
        partNumber: partNumber || undefined, // Will auto-generate if empty
        legacyPartNumber: legacyPN || null,
        name: name,
        type: type,
        category: category,
        costAvg: cost,
        costLow: cost,
        costHigh: cost,
        notes: notes,
        status: 'draft'
    });
    
    // Add to BOM
    Parts.addToBom(parentId, newPart.id, qty);
    
    closeAddToBomModal();
    showToast(`Created "${name}" and added to BOM`, 'success');
    showModal('bomEditor', parentId);
}

function showWhereUsedPopup(partId) {
    const part = Parts.getById(partId);
    const whereUsed = Parts.getWhereUsed(partId);
    
    const html = `
        <div class="modal-backdrop" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:500px">
                <div class="modal-header">
                    <h2 class="modal-title">Where Used: ${Utils.escapeHtml(part?.partNumber || partId)}</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    ${whereUsed.length === 0 
                        ? '<div class="empty-state" style="padding:40px"><div class="empty-state-title">Not used in any assemblies</div></div>'
                        : `<table>
                            <thead><tr><th>Assembly</th><th>Name</th><th>Qty</th></tr></thead>
                            <tbody>
                                ${whereUsed.map(w => `
                                    <tr style="cursor:pointer" onclick="closeModal();showModal('bomEditor', '${w.part.id}')">
                                        <td class="mono" style="color:var(--accent)">${Utils.escapeHtml(w.part.partNumber)}</td>
                                        <td>${Utils.escapeHtml(w.part.name)}</td>
                                        <td class="mono">${w.qty}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>`
                    }
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('modalContainer').innerHTML = html;
}

// =============================================================================
// EVENT HANDLERS
// =============================================================================
function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-view="${viewId}"]`)?.classList.add('active');
}

const handlePartsSearch = Utils.debounce((value) => {
    DB.searchTerm = value;
    renderPartsView();
}, 200);

function setFilter(type, value) {
    DB.filters[type] = value;
    renderPartsView();
}

function toggleSelectAllParts(checked, filteredIds) {
    // If filteredIds provided, only affect those items
    const idsToToggle = filteredIds || Array.from(document.querySelectorAll('.part-cb')).map(cb => cb.dataset.id);
    
    if (checked) {
        // Select all filtered items
        idsToToggle.forEach(id => DB.selectedParts.add(id));
    } else {
        // Deselect all filtered items
        idsToToggle.forEach(id => DB.selectedParts.delete(id));
    }
    
    // Update checkboxes without full re-render for better performance
    document.querySelectorAll('.part-cb').forEach(cb => {
        cb.checked = DB.selectedParts.has(cb.dataset.id);
    });
    
    renderPartsView();
}

function togglePartSelect(id, checked) {
    if (checked) DB.selectedParts.add(id);
    else DB.selectedParts.delete(id);
    renderPartsView();
}

function batchDeleteParts() {
    if (DB.selectedParts.size === 0) return;
    if (!confirm(`Delete ${DB.selectedParts.size} parts?`)) return;
    
    for (const id of DB.selectedParts) {
        Parts.delete(id);
    }
    DB.selectedParts.clear();
    renderAll();
}

function deletePart(id) {
    const part = Parts.getById(id);
    if (!part) return;
    
    const whereUsed = Parts.getWhereUsed(id);
    if (whereUsed.length > 0) {
        if (!confirm(`This part is used in ${whereUsed.length} assemblies. Delete anyway?`)) return;
    } else {
        if (!confirm(`Delete ${part.partNumber}?`)) return;
    }
    
    Parts.delete(id);
    renderAll();
}

function setupUploadZones() {
    ['partsUploadZone', 'bomsUploadZone'].forEach(id => {
        const zone = document.getElementById(id);
        if (!zone) return;
        
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('dragover'); };
        zone.ondragleave = () => zone.classList.remove('dragover');
        zone.ondrop = (e) => {
            e.preventDefault();
            zone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                if (id === 'partsUploadZone') handlePartsImport(file);
                else handleBomsImport(file);
            }
        };
    });
}

function handlePartsImport(file) {
    if (!file) return;
    ImportExport.importParts(file);
    closeModal();
}

function handleBomsImport(file) {
    if (!file) return;
    ImportExport.importBoms(file);
    closeModal();
}

// =============================================================================
// TOAST NOTIFICATIONS
// =============================================================================
function showToast(message, type = 'info', duration = 3000) {
    let container = document.getElementById('toastContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    
    const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
    };
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.info}</span>
        <span class="toast-message">${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
    `;
    
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

// =============================================================================
// KEYBOARD SHORTCUTS
// =============================================================================
function setupKeyboardShortcuts() {
    document.addEventListener('keydown', (e) => {
        // Don't trigger shortcuts when typing in inputs
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            // Escape to blur input
            if (e.key === 'Escape') {
                e.target.blur();
            }
            return;
        }
        
        // Ctrl/Cmd + S = Save
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            saveToStorage();
            showToast('Saved to browser storage', 'success');
        }
        
        // Ctrl/Cmd + E = Export
        if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
            e.preventDefault();
            quickExportJson();
        }
        
        // Ctrl/Cmd + I = Import
        if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
            e.preventDefault();
            document.getElementById('quickImportInput').click();
        }
        
        // Ctrl/Cmd + F = Focus search
        if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
            const searchInput = document.getElementById('partsSearchInput');
            if (searchInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        }
        
        // N = New part (when not in modal)
        if (e.key === 'n' && !document.querySelector('.modal-backdrop')) {
            showModal('newPart');
        }
        
        // Escape = Close modal
        if (e.key === 'Escape') {
            const modal = document.querySelector('.modal-backdrop');
            if (modal) {
                closeModal();
            }
        }
        
        // ? = Show shortcuts help
        if (e.key === '?' && e.shiftKey) {
            showShortcutsHelp();
        }
    });
}

function showShortcutsHelp() {
    const html = `
        <div class="modal-backdrop" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
                <div class="modal-header">
                    <h2 class="modal-title">⌨️ Keyboard Shortcuts</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <table style="width:100%">
                        <tr><td><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">S</kbd></td><td>Save to browser</td></tr>
                        <tr><td><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">E</kbd></td><td>Export database</td></tr>
                        <tr><td><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">I</kbd></td><td>Import database</td></tr>
                        <tr><td><kbd class="kbd">Ctrl</kbd> + <kbd class="kbd">F</kbd></td><td>Focus search</td></tr>
                        <tr><td><kbd class="kbd">N</kbd></td><td>New part</td></tr>
                        <tr><td><kbd class="kbd">Esc</kbd></td><td>Close modal / blur input</td></tr>
                        <tr><td><kbd class="kbd">?</kbd></td><td>Show this help</td></tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeModal()">Got it!</button>
                </div>
            </div>
        </div>
    `;
    document.getElementById('modalContainer').innerHTML = html;
}

// =============================================================================
// INITIALIZATION
// =============================================================================
document.addEventListener('DOMContentLoaded', () => {
    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => showView(item.dataset.view));
    });
    
    // Load data
    loadFromStorage();
    updateSyncStatus();
    renderAll();
    
    // Setup keyboard shortcuts
    setupKeyboardShortcuts();
    
    // Warn on unsaved changes
    window.addEventListener('beforeunload', (e) => {
        if (DB.hasUnsavedChanges) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
    
    // Auto-save every 30 seconds
    setInterval(() => {
        if (DB.hasUnsavedChanges) {
            saveToStorage();
            showToast('Auto-saved', 'info', 1500);
        }
    }, 30000);
    
    // Show welcome toast
    setTimeout(() => {
        if (DB.parts.length === 0) {
            showToast('Welcome! Import data or create your first part.', 'info', 5000);
        } else {
            showToast(`Loaded ${DB.parts.length} parts`, 'success', 2000);
        }
    }, 500);
});
</script>
