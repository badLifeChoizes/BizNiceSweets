    // Parse assembly info from single-assembly template
    parseSingleAssemblyInfo(data) {
        const info = {
            name: '',
            partNumber: '',
            legacyPartNumber: '',
            type: 'SA',
            category: '',
            status: 'draft',
            description: ''
        };
        
        // Look through first ~15 rows for labeled values
        for (let i = 0; i < Math.min(15, data.length); i++) {
            const row = data[i] || [];
            
            for (let j = 0; j < row.length; j++) {
                const cell = String(row[j] || '').trim();
                const nextCell = row[j + 1] !== undefined ? String(row[j + 1]).trim() : '';
                
                if (cell.toLowerCase().includes('assembly name') && cell.includes(':')) {
                    info.name = nextCell || '';
                } else if (cell.toLowerCase() === 'part number:' || cell.toLowerCase() === 'part number') {
                    info.partNumber = nextCell || '';
                } else if (cell.toLowerCase().includes('legacy')) {
                    info.legacyPartNumber = nextCell || '';
                } else if (cell.toLowerCase() === 'type:' || cell.toLowerCase() === 'type') {
                    info.type = nextCell || 'SA';
                } else if (cell.toLowerCase() === 'category:' || cell.toLowerCase() === 'category') {
                    info.category = nextCell || '';
                } else if (cell.toLowerCase() === 'status:' || cell.toLowerCase() === 'status') {
                    info.status = nextCell || 'draft';
                } else if (cell.toLowerCase() === 'description:' || cell.toLowerCase() === 'description') {
                    info.description = nextCell || '';
                }
            }
        }
        
        return info;
    },
    
    // Parse BOM items from single-assembly template
    parseSingleAssemblyBom(data) {
        const items = [];
        
        // Find the BOM table header row
        let headerRow = -1;
        let colMap = {};
        
        for (let i = 0; i < data.length; i++) {
            const row = data[i] || [];
            const rowStr = row.join(' ').toLowerCase();
            
            // Look for header row with Item, Part Number, Qty
            if (rowStr.includes('item') && rowStr.includes('part') && 
                (rowStr.includes('qty') || rowStr.includes('quantity'))) {
                headerRow = i;
                
                // Map column indices
                for (let j = 0; j < row.length; j++) {
                    const header = String(row[j] || '').toLowerCase().trim();
                    if (header === 'item' || header === '#') colMap.item = j;
                    if (header.includes('part number') || header === 'part number') colMap.partNumber = j;
                    if (header.includes('part name') || header.includes('description') || header === 'name') colMap.name = j;
                    if (header === 'qty' || header === 'quantity') colMap.qty = j;
                    if (header === 'type') colMap.type = j;
                    if (header.includes('cost')) colMap.cost = j;
                    if (header === 'notes' || header.includes('ref')) colMap.notes = j;
                }
                break;
            }
        }
        
        if (headerRow === -1) return items;
        
        // Parse BOM rows
        for (let i = headerRow + 1; i < data.length; i++) {
            const row = data[i] || [];
            
            // Get part number - skip if empty
            const partNumber = colMap.partNumber !== undefined ? String(row[colMap.partNumber] || '').trim() : '';
            if (!partNumber) continue;
            
            const item = {
                partNumber: partNumber,
                name: colMap.name !== undefined ? String(row[colMap.name] || '').trim() : '',
                qty: colMap.qty !== undefined ? (Number(row[colMap.qty]) || 1) : 1,
                type: colMap.type !== undefined ? String(row[colMap.type] || '').trim() : 'PP',
                cost: colMap.cost !== undefined ? (Number(row[colMap.cost]) || 0) : 0,
                notes: colMap.notes !== undefined ? String(row[colMap.notes] || '').trim() : ''
            };
            
            items.push(item);
        }
        
        return items;
    },
    
    // Import the single assembly and its BOM
    importSingleAssembly() {
        const info = window._importAssemblyInfo;
        const bomItems = window._importBomItems;
        
        if (!info || !info.name) {
            showToast('Assembly name is required', 'error');
            return;
        }
        
        // Find or create the assembly
        let assembly = DB.parts.find(p => p.name.toLowerCase() === info.name.toLowerCase());
        if (!assembly && info.partNumber) {
            assembly = Parts.getByPartNumber(info.partNumber);
        }
        
        if (assembly) {
            // Update existing assembly
            Parts.update(assembly.id, {
                name: info.name,
                legacyPartNumber: info.legacyPartNumber || assembly.legacyPartNumber,
                type: info.type || assembly.type,
                category: info.category || assembly.category,
                status: info.status || assembly.status,
                description: info.description || assembly.description
            });
        } else {
            // Create new assembly
            assembly = Parts.create({
                partNumber: info.partNumber || '',
                name: info.name,
                legacyPartNumber: info.legacyPartNumber || '',
                type: info.type || 'SA',
                category: info.category || '',
                status: info.status || 'draft',
                description: info.description || ''
            });
        }
        
        // Clear existing BOM and rebuild
        assembly.bom = [];
        
        let partsCreated = 0;
        let bomAdded = 0;
        
        // Add BOM items
        for (const item of bomItems) {
            // Find or create child part
            let child = Parts.getByPartNumber(item.partNumber);
            if (!child) {
                child = DB.parts.find(p => p.name.toLowerCase() === item.partNumber.toLowerCase());
            }
            if (!child) {
                // Create new part
                child = Parts.create({
                    partNumber: item.partNumber,
                    name: item.name || item.partNumber,
                    type: item.type || 'PP',
                    costAvg: item.cost || 0,
                    status: 'draft'
                });
                partsCreated++;
            }
            
            // Add to BOM
            Parts.addToBom(assembly.id, child.id, item.qty, item.notes);
            bomAdded++;
        }
        
        // Clean up
        window._importAssemblyInfo = null;
        window._importBomItems = null;
        window._importWorkbook = null;
        
        renderAll();
        closeModal();
        
        // Select the imported assembly for viewing
        DB.selectedBomPart = assembly.id;
        showView('bom');
        renderBomView();
        
        showToast(`Imported "${info.name}" with ${bomAdded} BOM items (${partsCreated} new parts created)`, 'success');
    },

    _doImportParts(wb, sheetName) {
        const sheet = sheetName ? wb.Sheets[sheetName] : wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(sheet);
        
        let imported = 0;
        let updated = 0;
        let skipped = 0;
        
        for (const row of data) {
            const firstCell = Object.values(row)[0];
            if (typeof firstCell === 'string' && (
                firstCell.includes('REQUIRED') || 
                firstCell.includes('Leave blank') ||
                firstCell.includes('Example') ||
                firstCell.toLowerCase().includes('delete before')
            )) {
                skipped++;
                continue;
            }
            
            const name = this.getColumnValue(row, this.columnAliases.name);
            const partNumber = this.getColumnValue(row, this.columnAliases.partNumber);
            const legacyPN = this.getColumnValue(row, this.columnAliases.legacyPartNumber);
            const type = this.getColumnValue(row, this.columnAliases.type);
            const category = this.getColumnValue(row, this.columnAliases.category);
            const status = this.getColumnValue(row, this.columnAliases.status);
            const cost = this.getColumnValue(row, this.columnAliases.cost);
            const costAvg = this.getColumnValue(row, this.columnAliases.costAvg);
            const notes = this.getColumnValue(row, this.columnAliases.notes);
            
            if (!name && !partNumber) {
                skipped++;
                continue;
            }
            
            let existing = null;
            if (partNumber) existing = Parts.getByPartNumber(partNumber);
            if (!existing && name) existing = DB.parts.find(p => p.name.toLowerCase() === name.toLowerCase());
            
            if (existing) {
                Parts.update(existing.id, {
                    name: name || existing.name,
                    legacyPartNumber: legacyPN || existing.legacyPartNumber,
                    type: type || existing.type,
                    category: category || existing.category,
                    status: status || existing.status,
                    costAvg: Number(costAvg || cost) || existing.costAvg,
                    notes: notes || existing.notes
                });
                updated++;
            } else {
                Parts.create({
                    partNumber: partNumber || '',
                    name: name || partNumber || 'New Part',
                    legacyPartNumber: legacyPN || '',
                    type: type || 'SA',
                    category: category || '',
                    status: status || 'draft',
                    costAvg: Number(costAvg || cost) || 0,
                    notes: notes || ''
                });
                imported++;
            }
        }
        
        renderAll();
        closeModal();
        showToast(`Imported ${imported} new, updated ${updated}, skipped ${skipped}`, 'success');
    },
    
    importBoms(file, sheetName) {
        if (file) {
            this.parseFile(file, (wb) => {
                this._doImportBoms(wb, sheetName);
            });
        } else if (window._importWorkbook) {
            this._doImportBoms(window._importWorkbook, sheetName);

    },
    
    _doImportBoms(wb, sheetName) {
        const sheet = sheetName ? wb.Sheets[sheetName] : wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(sheet);
        
        let added = 0;
        let skipped = 0;
        let partsCreated = 0;
        
        for (const row of data) {
            const firstCell = Object.values(row)[0];
            if (typeof firstCell === 'string' && (
                firstCell.includes('MUST match') || 
                firstCell.includes('Example') ||
                firstCell.toLowerCase().includes('delete before')
            )) {
                skipped++;
                continue;
            }
            
            const assemblyName = this.getColumnValue(row, this.columnAliases.assemblyName);
            const childPN = this.getColumnValue(row, this.columnAliases.childPartNumber);
            const childName = this.getColumnValue(row, ['Part Name', 'Part_Name', 'Name', 'Description']);
            const qty = Number(this.getColumnValue(row, this.columnAliases.qty)) || 1;
            
            if (!assemblyName || !childPN) {
                skipped++;
                continue;
            }
            
            let parent = DB.parts.find(p => p.name.toLowerCase() === assemblyName.toLowerCase());
            if (!parent) parent = Parts.getByPartNumber(assemblyName);
            if (!parent) {
                parent = Parts.create({ name: assemblyName, type: 'SA', status: 'draft' });
                partsCreated++;
            }
            
            let child = Parts.getByPartNumber(childPN);
            if (!child) child = DB.parts.find(p => p.name.toLowerCase() === childPN.toLowerCase());
            if (!child) {
                child = Parts.create({ partNumber: childPN, name: childName || childPN, type: 'PP', status: 'draft' });
                partsCreated++;
            }
            
            const existingInBom = parent.bom?.find(b => b.partId === child.id);
            if (existingInBom) {
                existingInBom.qty = qty;
            } else {
                Parts.addToBom(parent.id, child.id, qty);
            }
            added++;
        }
        
        renderAll();
        closeModal();
        showToast(`Added ${added} BOM items, created ${partsCreated} new parts, skipped ${skipped}`, 'success');
    },
    
    exportAll() {
        const wb = XLSX.utils.book_new();
        
        // Parts sheet
        const partsData = DB.parts.map(p => ({
            Part_Number: p.partNumber,
            Name: p.name,
            Type: p.type,
            Category: p.category,
            Revision: p.revision,
            Status: p.status,
            Cost: p.cost,
            Costed_Date: p.costedDate,
            Cost_Low: p.costLow,
            Cost_High: p.costHigh,
            Cost_Avg: p.costAvg,
            Is_Product: p.isProduct,
            Has_BOM: (p.bom && p.bom.length > 0),
            Notes: p.notes,
            Created: p.created,
            Modified: p.modified
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(partsData), 'Parts');
        
        // BOMs sheet
        const bomData = [];
        for (const part of DB.parts) {
            if (part.bom && part.bom.length > 0) {
                for (const item of part.bom) {
                    const child = Parts.getById(item.partId);
                    bomData.push({
                        Parent_PN: part.partNumber,
                        Parent_Name: part.name,
                        Child_PN: child?.partNumber || item.partId,
                        Child_Name: child?.name || '',
                        Qty: item.qty
                    });
                }
            }
        }
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bomData), 'BOMs');
        
        // Products sheet
        const productsData = Parts.getProducts().map(p => ({
            Part_Number: p.partNumber,
            Name: p.name,
            Revision: p.revision,
            Status: p.status,
            Total_Cost: Parts.getRolledUpCost(p.id)
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productsData), 'Products');
        
        XLSX.writeFile(wb, `PLM_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
    },
    
    exportProductBom(productId) {
        const product = Parts.getById(productId);
        if (!product) return;
        
        const wb = XLSX.utils.book_new();
        
        // Indented BOM
        const indented = [];
        const addToIndented = (partId, level = 0, parentQty = 1) => {
            const part = Parts.getById(partId);
            if (!part) return;
            
            indented.push({
                Level: level,
                Part_Number: part.partNumber,
                Name: part.name,
                Type: part.type,
                Qty: parentQty,
                Unit_Cost: Parts.getEffectiveCost(part),
                Extended_Cost: Parts.getEffectiveCost(part) * parentQty
            });
            
            if (part.bom) {
                for (const item of part.bom) {
                    addToIndented(item.partId, level + 1, item.qty * parentQty);
                }
            }
        };
        addToIndented(productId);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(indented), 'Indented_BOM');
        
        // Flat BOM
        const flatBom = Parts.generateFlatBom(productId);
        const flatData = flatBom.map(item => ({
            Part_Number: item.partNumber,
            Name: item.name,
            Type: item.type,
            Total_Qty: item.qty,
            Unit_Cost: item.cost,
            Extended_Cost: item.qty * item.cost
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flatData), 'Flat_BOM');
        
        XLSX.writeFile(wb, `${product.partNumber}_BOM.xlsx`);
    }
};

const ExportManager = {
    // Get dashboard statistics
    getDashboardStats() {
        const products = Parts.getProducts();
        const assemblies = Parts.getAssemblies();
        const tbdCount = DB.parts.filter(p => (p.legacyPartNumber || '').toUpperCase().includes('TBD')).length;
        
        const stats = {
            totalItems: DB.parts.length,
            products: products.length,
            assemblies: assemblies.length,
            partsOnly: DB.parts.filter(p => !p.bom || p.bom.length === 0).length,
            released: DB.parts.filter(p => p.status === 'released').length,
            draft: DB.parts.filter(p => p.status === 'draft').length,
            obsolete: DB.parts.filter(p => p.status === 'obsolete').length,
            tbdParts: tbdCount,
            totalCost: DB.parts.reduce((sum, p) => {
                const cost = p.status === 'released' && p.cost > 0 ? p.cost : p.costAvg;
                return sum + (cost || 0);
            }, 0)
        };
        
        // Cost by type
        const costByType = {};
        DB.parts.forEach(p => {
            const type = p.type || 'Other';
            const cost = p.status === 'released' && p.cost > 0 ? p.cost : p.costAvg;
            if (!costByType[type]) costByType[type] = { count: 0, cost: 0 };
            costByType[type].count++;
            costByType[type].cost += cost || 0;
        });
        stats.costByType = costByType;
        
        // Cost by category
        const costByCategory = {};
        DB.parts.forEach(p => {
            const cat = p.category || 'Uncategorized';
            const cost = p.status === 'released' && p.cost > 0 ? p.cost : p.costAvg;
            if (!costByCategory[cat]) costByCategory[cat] = { count: 0, cost: 0 };
            costByCategory[cat].count++;
            costByCategory[cat].cost += cost || 0;
        });
        stats.costByCategory = costByCategory;
        
        return stats;
    },

    formatPartForExport(p) {
        const hasBom = p.bom && p.bom.length > 0;

        let itemClass = 'PART';
        if (p.isProduct) itemClass = 'PRODUCT';
        else if (hasBom) itemClass = 'ASSEMBLY';
        
        return {
            Part_Number: p.partNumber,
            Legacy_PN: p.legacyPartNumber || '',
            Name: p.name,
            Class: itemClass,
            Type: p.type,
            Category: p.category || '',

            Status: p.status,
            Cost_Released: p.cost || 0,

function renderAll() {
    updateNavCounts();
    updateProductSelector();
    renderDashboard();
    renderPartsView();
    renderProductsView();
    renderBomView();
    renderFlatBomView();
    renderWhereUsedView();
    renderConflictsView();
    renderVersionsView();
    renderHistoryView();
}

function updateNavCounts() {
    document.getElementById('navPartsCount').textContent = DB.parts.length;
    document.getElementById('navProductsCount').textContent = Parts.getProducts().length;
    document.getElementById('navHistoryCount').textContent = DB.history.length;
    
    // Update conflicts count
    const conflicts = ConflictDetection.findConflicts(40);
    const dismissed = ConflictDetection.getDismissed();
    const activeConflicts = conflicts.filter(c => !dismissed.includes(c.id));
    document.getElementById('navConflictsCount').textContent = activeConflicts.length;
}

function updateProductSelector() {
    const select = document.getElementById('productSelect');
    const currentVal = select.value;
    const products = Parts.getProducts();
    
    let html = '<option value="">All Parts (No Product)</option>';
    for (const p of products) {
        html += `<option value="${p.id}">${Utils.escapeHtml(p.partNumber)} - ${Utils.escapeHtml(p.name)}</option>`;
    }
    select.innerHTML = html;
    
    // Restore selection if still valid
    if (currentVal && products.find(p => p.id === currentVal)) {
        select.value = currentVal;
    }
}

function selectProduct(productId) {
    DB.selectedProduct = productId || null;
    renderAll();
}

                            <div class="stat-card">

                                    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px">
                                        <span><span class="tag tag-type">${type}</span> (${data.count})</span>
                                        <span class="mono" style="color:var(--accent)">${Utils.formatCurrency(data.cost)}</span>
                                    </div>

                                    <span>Total</span>
                                    <span class="mono" style="color:var(--success)">${Utils.formatCurrency(totalCost)}</span>
                                </div>
                            </div>
                            
                            <div style="background:var(--bg-tertiary);padding:16px;border-radius:8px">
                                <div style="font-weight:600;margin-bottom:12px">Direct BOM Items</div>
                                <div style="max-height:150px;overflow-y:auto">
                                    ${(product.bom || []).slice(0, 10).map(item => {
                                        const child = Parts.getById(item.partId);
                                        const isAssy = child && child.bom && child.bom.length > 0;
                                        return child ? `
                                            <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px">
                                                <span>
                                                    ${isAssy ? '<span class="tag tag-assy" style="padding:1px 4px;font-size:9px;margin-right:4px">ASSY</span>' : ''}
                                                    ${Utils.escapeHtml(child.partNumber)}
                                                </span>
                                                <span class="mono">×${item.qty}</span>
                                            </div>
                                        ` : '';
                                    }).join('')}
                                    ${(product.bom || []).length > 10 ? `<div style="color:var(--text-muted);font-size:11px">...and ${product.bom.length - 10} more</div>` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <div style="margin-top:16px;display:flex;gap:8px">
                            <button class="btn" onclick="showModal('bomEditor', '${product.id}')">📋 Edit BOM</button>
                            <button class="btn" onclick="showView('bom')">🌳 View Tree</button>

    container.innerHTML = `

        </div>
        
        ${productDetailHtml}
        
        <!-- Global Stats -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Total Items</div><div class="stat-value">${DB.parts.length}</div></div>
            <div class="stat-card"><div class="stat-label">Products</div><div class="stat-value" style="color:var(--accent)">${products.length}</div></div>
            <div class="stat-card"><div class="stat-label">Assemblies</div><div class="stat-value">${assemblies.length}</div></div>
            <div class="stat-card"><div class="stat-label">Released</div><div class="stat-value" style="color:var(--success)">${releasedCount}</div></div>
            <div class="stat-card"><div class="stat-label">Draft</div><div class="stat-value" style="color:var(--warning)">${draftCount}</div></div>
            <div class="stat-card"><div class="stat-label">TBD Parts</div><div class="stat-value" style="color:${tbdCount > 0 ? 'var(--error)' : 'var(--text-muted)'}">${tbdCount}</div></div>
        </div>
        
        <div class="card">
            <div class="card-header"><span class="card-title">Recent Changes</span></div>
            <div class="card-body" style="padding:0;max-height:300px;overflow-y:auto">
                ${DB.history.slice(0, 10).map(h => `
                    <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center">
                        <span style="font-size:18px">${h.action === 'create' ? '➕' : h.action === 'update' ? '✏️' : '🗑️'}</span>
                        <div style="flex:1">
                            <div style="font-weight:500">${Utils.escapeHtml(h.description)}</div>
                            <div style="font-size:12px;color:var(--text-muted)">${Utils.formatDateTime(h.timestamp)}</div>

                `).join('') || '<div class="empty-state"><div class="empty-state-title">No changes yet</div></div>'}
            </div>
        </div>
    `;
}

// Parts View
function renderPartsView() {
    const container = document.getElementById('view-parts');
    
    // Get unique values for column filters
    const allClasses = ['PROD', 'ASSY', 'PART'];
    const allTypes = [...new Set(DB.parts.map(p => p.type).filter(Boolean))].sort();
    const allStatuses = ['draft', 'released', 'obsolete'];
    const allCategories = [...new Set(DB.parts.map(p => p.category).filter(Boolean))].sort();
    
    // Count values for each filter option
    const getClassCounts = () => {
        const counts = { PROD: 0, ASSY: 0, PART: 0 };
        DB.parts.forEach(p => {
            if (p.isProduct) counts.PROD++;
            else if (p.bom && p.bom.length > 0) counts.ASSY++;
            else counts.PART++;
        });
        return counts;
    };
    const classCounts = getClassCounts();
    
    const typeCounts = {};
    allTypes.forEach(t => typeCounts[t] = DB.parts.filter(p => p.type === t).length);
    
    const statusCounts = {};
    allStatuses.forEach(s => statusCounts[s] = DB.parts.filter(p => p.status === s).length);
    
    const categoryCounts = {};
    allCategories.forEach(c => categoryCounts[c] = DB.parts.filter(p => p.category === c).length);
    
    // Filter parts
    let filtered = [...DB.parts];
    
    // Text search
    if (DB.searchTerm) {
        const term = DB.searchTerm.toLowerCase();
        filtered = filtered.filter(p => 
            p.partNumber.toLowerCase().includes(term) || 
            p.name.toLowerCase().includes(term) ||
            (p.legacyPartNumber || '').toLowerCase().includes(term)
        );
    }
    
    // Column filter: Class
    if (DB.columnFilters.class.size > 0) {
        filtered = filtered.filter(p => {
            let itemClass = 'PART';
            if (p.isProduct) itemClass = 'PROD';
            else if (p.bom && p.bom.length > 0) itemClass = 'ASSY';
            return DB.columnFilters.class.has(itemClass);
        });
    }
    
    // Column filter: Type
    if (DB.columnFilters.type.size > 0) {
        filtered = filtered.filter(p => DB.columnFilters.type.has(p.type));
    }
    
    // Column filter: Status
    if (DB.columnFilters.status.size > 0) {
        filtered = filtered.filter(p => DB.columnFilters.status.has(p.status));
    }
    
    // Column filter: Category
    if (DB.columnFilters.category.size > 0) {
        filtered = filtered.filter(p => DB.columnFilters.category.has(p.category));
    }
    
    // TBD filter
    if (DB.filters.tbdFilter) {
        filtered = filtered.filter(p => (p.legacyPartNumber || '').toUpperCase().includes('TBD'));
    }
    
    // Sort
    filtered = sortParts(filtered, DB.sort.column, DB.sort.direction);
    
    // Count TBD parts
    const tbdCount = DB.parts.filter(p => (p.legacyPartNumber || '').toUpperCase().includes('TBD')).length;
    
    // Check if all filtered parts are selected
    const allFilteredSelected = filtered.length > 0 && filtered.every(p => DB.selectedParts.has(p.id));
    
    // Check if any column filters are active
    const hasColumnFilters = DB.columnFilters.class.size > 0 || DB.columnFilters.type.size > 0 || 
                             DB.columnFilters.status.size > 0 || DB.columnFilters.category.size > 0;
    
    // Helper to render column filter dropdown
    const renderColumnFilter = (column, values, counts, currentFilters) => {
        if (DB.activeColumnFilter !== column) return '';
        return `
            <div class="col-filter-dropdown" onclick="event.stopPropagation()">
                <div class="col-filter-header">
                    <span class="col-filter-title">Filter ${column}</span>
                    <span class="col-filter-clear" onclick="clearColumnFilter('${column}')">Clear</span>
                </div>
                <div class="col-filter-sort">
                    <button class="${DB.sort.column === column && DB.sort.direction === 'asc' ? 'active' : ''}" 
                            onclick="sortColumn('${column}', 'asc')">A→Z</button>
                    <button class="${DB.sort.column === column && DB.sort.direction === 'desc' ? 'active' : ''}" 
                            onclick="sortColumn('${column}', 'desc')">Z→A</button>
                </div>
                <div class="col-filter-options">
                    ${values.map(v => `
                        <div class="col-filter-option">
                            <input type="checkbox" id="cf-${column}-${v}" 
                                   ${currentFilters.has(v) ? 'checked' : ''} 
                                   onchange="toggleColumnFilter('${column}', '${v}', this.checked)">
                            <label for="cf-${column}-${v}">${v}</label>
                            <span class="col-filter-count">(${counts[v] || 0})</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    };
    
    container.innerHTML = `
        <div class="page-header">
            <div>
                <h1 class="page-title">Parts Database</h1>
                <p class="page-subtitle">${filtered.length} of ${DB.parts.length} items ${tbdCount > 0 ? `<span class="tbd-warning">(${tbdCount} TBD)</span>` : ''}</p>
            </div>
            <div class="page-actions">
                <!-- Import button -->
                <label class="btn" style="cursor:pointer">
                    📥 Import
                    <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="if(this.files[0]) ImportExport.showImportModal(this.files[0])">
                </label>
                
                <!-- Export dropdown -->

                    <button class="btn" onclick="toggleExportMenu()">📤 Export ▼</button>
                    <div id="exportMenu" class="dropdown-menu" style="display:none">
                        <button class="dropdown-item" onclick="ExportManager.exportAllParts()">📤 Export All Parts (${DB.parts.length})</button>
                        <button class="dropdown-item" onclick="ExportManager.exportFilteredParts()" ${filtered.length === DB.parts.length ? 'disabled' : ''}>📤 Export Filtered (${filtered.length})</button>
                        <button class="dropdown-item" onclick="ExportManager.exportSelectedParts()" ${DB.selectedParts.size === 0 ? 'disabled' : ''}>📤 Export Selected (${DB.selectedParts.size})</button>
                        <div style="border-top:1px solid var(--border);margin:4px 0"></div>
                        <button class="dropdown-item" onclick="ExportManager.exportDashboardReport()">📊 Dashboard Report</button>
                        <button class="dropdown-item" onclick="ExportManager.exportFullDatabase()">💾 Full Database Export</button>
                    </div>
                </div>
                
                <button class="btn btn-danger ${DB.selectedParts.size === 0 ? 'hidden' : ''}" id="batchDeleteBtn" onclick="batchDeleteParts()">
                    🗑️ Delete (${DB.selectedParts.size})

                <button class="btn ${!hasColumnFilters && !DB.filters.tbdFilter ? 'hidden' : ''}" onclick="clearAllFilters()">🔄 Clear Filters</button>
                <button class="btn btn-primary" onclick="showModal('newPart')">➕ New Part</button>
            </div>
        </div>
        
        <!-- Part Selector Info Bar -->
        ${DB.selectedBomPart ? (() => {
            const selectedPart = Parts.getById(DB.selectedBomPart);
            const whereUsedCount = selectedPart ? Parts.getWhereUsed(selectedPart.id).length : 0;
            const bomCount = selectedPart?.bom?.length || 0;
            return `
            <div class="card" style="margin-bottom:16px;background:var(--bg-tertiary)">
                <div class="card-body" style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
                    <div style="display:flex;align-items:center;gap:12px">
                        <span style="font-size:13px;color:var(--text-secondary)">👁️ Selected:</span>
                        <strong style="color:var(--accent)">${Utils.escapeHtml(selectedPart?.partNumber || '')}</strong>
                        <span style="color:var(--text-muted)">${Utils.escapeHtml(selectedPart?.name || '')}</span>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <button class="btn btn-sm" onclick="showView('bom')">🌳 Indented BOM${bomCount > 0 ? ` (${bomCount})` : ''}</button>
                        <button class="btn btn-sm" onclick="showView('flatbom')">📋 Flat BOM</button>
                        <button class="btn btn-sm" onclick="showView('whereused')">🔗 Where Used${whereUsedCount > 0 ? ` (${whereUsedCount})` : ''}</button>
                        <button class="btn btn-sm" onclick="clearBomSelection()">✕ Clear</button>

                </div>
            </div>
        `})() : ''}
        
        <div class="card">
            <div class="card-header" style="flex-direction:column;gap:12px">
                <div class="toolbar" style="width:100%">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>

                    </div>
                    <div style="flex:1"></div>
                    <button class="filter-pill ${DB.filters.tbdFilter ? 'active warning' : ''}" onclick="toggleTbdFilter()" title="Show only TBD items">⚠️ TBD Only<span class="count">${tbdCount}</span></button>
                    <span style="font-size:12px;color:var(--text-muted)">Click column headers to filter/sort</span>
                </div>
            </div>
            <div class="table-container" style="max-height:calc(100vh - 340px);overflow:auto">
                <table>
                    <thead>

                            </th>
                            <th style="width:40px" title="Select part to view in BOM/Where Used">View</th>
                            <th class="sortable filterable ${DB.sort.column === 'class' ? 'active' : ''}" onclick="toggleColumnFilterDropdown(event, 'class')" style="width:70px;position:relative">
                                Class ${DB.columnFilters.class.size > 0 ? '<span class="filter-indicator"></span>' : ''} <span class="sort-icon">${getSortIcon('class')}</span>
                                ${renderColumnFilter('class', allClasses, classCounts, DB.columnFilters.class)}
                            </th>

                                Part Number <span class="sort-icon">${getSortIcon('partNumber')}</span>

                            <th class="sortable ${DB.sort.column === 'legacyPartNumber' ? 'active' : ''}" onclick="toggleSort('legacyPartNumber')">
                                Legacy PN <span class="sort-icon">${getSortIcon('legacyPartNumber')}</span>

                            </th>
                            <th class="sortable filterable ${DB.sort.column === 'category' ? 'active' : ''}" onclick="toggleColumnFilterDropdown(event, 'category')" style="position:relative">
                                Category ${DB.columnFilters.category.size > 0 ? '<span class="filter-indicator"></span>' : ''} <span class="sort-icon">${getSortIcon('category')}</span>

// Column Filter Functions
function toggleColumnFilterDropdown(event, column) {
    event.stopPropagation();
    if (DB.activeColumnFilter === column) {
        DB.activeColumnFilter = null;
    } else {
        DB.activeColumnFilter = column;
    }
    renderPartsView();
}

function toggleColumnFilter(column, value, checked) {
    if (checked) {
        DB.columnFilters[column].add(value);
    } else {
        DB.columnFilters[column].delete(value);
    }
    renderPartsView();
}

function clearColumnFilter(column) {
    DB.columnFilters[column].clear();
    DB.activeColumnFilter = null;
    renderPartsView();
}

function sortColumn(column, direction) {
    DB.sort.column = column;

// Indented BOM View
function renderBomView() {
    const container = document.getElementById('view-bom');
    
    // Get all parts that have BOMs (assemblies and products)
    const partsWithBom = DB.parts.filter(p => p.bom && p.bom.length > 0);
    const products = Parts.getProducts();
    const assembliesOnly = partsWithBom.filter(p => !p.isProduct);
    
    // Use selectedBomPart or fall back to selectedProduct
    const selectedId = DB.selectedBomPart || DB.selectedProduct;
    const selectedPart = selectedId ? Parts.getById(selectedId) : null;
    
    // Part selector HTML
    const selectorHtml = `
        <div class="card" style="margin-bottom:24px">
            <div class="card-header">
                <span class="card-title">🌳 Select Part to View BOM</span>
            </div>
            <div class="card-body" style="padding:16px">
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                    <select class="form-select" style="flex:1;max-width:400px" onchange="selectBomPart(this.value)">
                        <option value="">-- Select a part --</option>
                        ${products.length > 0 ? `
                            <optgroup label="🎯 Products (${products.length})">
                                ${products.map(p => `
                                    <option value="${p.id}" ${selectedId === p.id ? 'selected' : ''}>
                                        ${Utils.escapeHtml(p.partNumber)} - ${Utils.escapeHtml(p.name)}
                                    </option>
                                `).join('')}
                            </optgroup>
                        ` : ''}
                        ${assembliesOnly.length > 0 ? `
                            <optgroup label="🔧 Assemblies (${assembliesOnly.length})">
                                ${assembliesOnly.map(p => `
                                    <option value="${p.id}" ${selectedId === p.id ? 'selected' : ''}>
                                        ${Utils.escapeHtml(p.partNumber)} - ${Utils.escapeHtml(p.name)}
                                    </option>
                                `).join('')}
                            </optgroup>
                        ` : ''}
                    </select>
                    ${partsWithBom.length === 0 ? `
                        <span style="color:var(--text-muted);font-size:13px">No assemblies found. Add parts to a BOM first.</span>
                    ` : ''}
                </div>
            </div>
        </div>
    `;
    
    if (!selectedPart) {
        container.innerHTML = `
            <div class="page-header">
                <div>
                    <h1 class="page-title">Indented BOM</h1>
                    <p class="page-subtitle">View hierarchical bill of materials</p>
                </div>
            </div>
            ${selectorHtml}
            <div class="empty-state">
                <div class="empty-state-icon">🌳</div>
                <div class="empty-state-title">No Part Selected</div>
                <p style="color:var(--text-muted)">Select a product or assembly above to view its BOM structure</p>
            </div>
        `;
        return;
    }
    
    const hasBom = selectedPart.bom && selectedPart.bom.length > 0;
    const totalCost = Parts.getRolledUpCost(selectedPart.id);
    const flatBom = Parts.generateFlatBom(selectedPart.id);
    
    // Build tree HTML
    function buildTreeHtml(partId, level = 0, parentQty = 1) {
        const part = Parts.getById(partId);
        if (!part) return '';
        
        const hasBom = part.bom && part.bom.length > 0;
        const nodeKey = `${partId}-${level}`;
        const isExpanded = DB.expandedBomNodes.has(nodeKey) || level === 0;
        const cost = Parts.getEffectiveCost(part);
        const extCost = cost * parentQty;
        
        // Determine class
        let classTag = '';
        if (part.isProduct) classTag = '<span class="tag tag-product" style="font-size:9px;margin-left:6px">PROD</span>';
        else if (hasBom) classTag = '<span class="tag tag-assy" style="font-size:9px;margin-left:6px">ASSY</span>';
        
        let html = `
            <div class="bom-row level-${Math.min(level, 4)}">
                <div class="bom-expand ${hasBom ? '' : 'empty'}" onclick="toggleBomNode('${nodeKey}')">${hasBom ? (isExpanded ? '▼' : '▶') : ''}</div>
                <div class="bom-info">
                    <span class="bom-pn">${Utils.escapeHtml(part.partNumber)}</span>
                    <span class="bom-name">${Utils.escapeHtml(part.name)}</span>
                    <span class="tag tag-type" style="font-size:10px">${part.type}</span>
                    ${classTag}
                </div>
                <div class="bom-qty">${parentQty}</div>
                <div class="bom-cost">${Utils.formatCurrency(cost)}</div>
                <div class="bom-ext">${Utils.formatCurrency(extCost)}</div>
                <div class="bom-actions">
                    ${hasBom ? `<button class="btn btn-xs" onclick="selectBomPart('${part.id}')" title="View this part's BOM">🔍</button>` : ''}
                    <button class="btn btn-xs" onclick="showModal('bomEditor', '${part.id}')" title="Edit BOM">📋</button>
                </div>
            </div>
        `;
        
        if (hasBom && isExpanded) {
            for (const item of part.bom) {
                html += buildTreeHtml(item.partId, level + 1, item.qty);
            }
        }
        
        return html;
    }
    
    container.innerHTML = `
        <div class="page-header">
            <div>
                <h1 class="page-title">Indented BOM</h1>
                <p class="page-subtitle">${Utils.escapeHtml(selectedPart.partNumber)} - ${Utils.escapeHtml(selectedPart.name)}</p>
            </div>
            <div class="page-actions">
                <button class="btn" onclick="expandAllBom()">➕ Expand All</button>
                <button class="btn" onclick="collapseAllBom()">➖ Collapse All</button>
                <button class="btn" onclick="showModal('bomEditor', '${selectedPart.id}')">📋 Edit BOM</button>
                <button class="btn btn-primary" onclick="ImportExport.exportProductBom('${selectedPart.id}')">📤 Export</button>
            </div>
        </div>
        
        ${selectorHtml}
        
        ${!hasBom ? `
            <div class="empty-state">
                <div class="empty-state-icon">📄</div>
                <div class="empty-state-title">No BOM</div>
                <p style="color:var(--text-muted)">This part has no bill of materials</p>
                <button class="btn btn-primary" style="margin-top:16px" onclick="showModal('bomEditor', '${selectedPart.id}')">➕ Add Parts to BOM</button>
            </div>
        ` : `
            <div class="stats-grid" style="max-width:800px;margin-bottom:24px">
                <div class="stat-card"><div class="stat-label">Direct Items</div><div class="stat-value">${selectedPart.bom.length}</div></div>
                <div class="stat-card"><div class="stat-label">Unique Parts</div><div class="stat-value">${flatBom.length}</div></div>
                <div class="stat-card"><div class="stat-label">Total Qty</div><div class="stat-value">${flatBom.reduce((s, p) => s + p.qty, 0)}</div></div>
                <div class="stat-card"><div class="stat-label">Total Cost</div><div class="stat-value accent">${Utils.formatCurrency(totalCost)}</div></div>
            </div>
            
            <div class="bom-tree">
                <div class="bom-row" style="background:var(--bg-tertiary);font-weight:600;font-size:12px;color:var(--text-secondary)">
                    <div class="bom-expand"></div>
                    <div class="bom-info">PART NUMBER / NAME</div>
                    <div class="bom-qty">QTY</div>
                    <div class="bom-cost">UNIT</div>
                    <div class="bom-ext">EXT</div>
                    <div class="bom-actions"></div>
                </div>
                ${buildTreeHtml(selectedPart.id)}
            </div>
        `}
    `;
}

function selectBomPart(partId) {
    DB.selectedBomPart = partId || null;
    DB.expandedBomNodes.clear();
    DB.expandedWhereUsedNodes.clear();
    renderPartsView();
    renderBomView();
    renderFlatBomView();
    renderWhereUsedView();
}

function viewPartBom(partId) {
    DB.selectedBomPart = partId;
    DB.expandedBomNodes.clear();
    DB.expandedWhereUsedNodes.clear();
    showView('bom');
    renderBomView();
}

function toggleBomNode(nodeKey) {
    if (DB.expandedBomNodes.has(nodeKey)) {
        DB.expandedBomNodes.delete(nodeKey);
    } else {
        DB.expandedBomNodes.add(nodeKey);
    }
    renderBomView();
}

function expandAllBom() {
    const selectedId = DB.selectedBomPart || DB.selectedProduct;
    if (!selectedId) return;
    
    // Expand all nodes
    function expandAll(partId, level = 0) {
        const part = Parts.getById(partId);
        if (!part) return;
        DB.expandedBomNodes.add(`${partId}-${level}`);
        if (part.bom) {
            for (const item of part.bom) {
                expandAll(item.partId, level + 1);
            }
        }
    }
    expandAll(selectedId);
    renderBomView();
}

function collapseAllBom() {
    DB.expandedBomNodes.clear();
    renderBomView();
}

                                    <td>${Utils.escapeHtml(d.part.name)}</td>
                                    <td><span class="tag tag-assy">${d.usedIn.length}</span></td>
                                    <td style="font-size:12px;color:var(--text-secondary)">${d.usedIn.slice(0, 3).map(u => Utils.escapeHtml(u.part.partNumber)).join(', ')}${d.usedIn.length > 3 ? '...' : ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${usageData.length === 0 ? '<div class="empty-state"><div class="empty-state-icon">🔗</div><div class="empty-state-title">No usage data</div><p style="color:var(--text-muted)">Add parts to assembly BOMs to see where they are used</p></div>' : ''}
                </div>
            </div>
        `;
        return;
    }
    
    // Get where used data for selected part
    const whereUsed = Parts.getWhereUsed(selectedPart.id);
    
    // Build indented where-used tree (going UP the hierarchy)
    const buildWhereUsedTree = (partId, depth = 0, visited = new Set()) => {
        if (visited.has(partId)) return []; // Prevent cycles
        visited.add(partId);
        
        const usages = Parts.getWhereUsed(partId);
        let rows = [];
        
        usages.forEach(usage => {
            const parentPart = usage.part;
            const nodeKey = `${partId}-${parentPart.id}`;
            const isExpanded = DB.expandedWhereUsedNodes.has(nodeKey);
            const parentUsages = Parts.getWhereUsed(parentPart.id);
            const hasParents = parentUsages.length > 0;
            
            // Determine class of parent
            let classTag = '<span class="tag tag-part-class">PART</span>';
            if (parentPart.isProduct) {
                classTag = '<span class="tag tag-product">PROD</span>';
            } else if (parentPart.bom && parentPart.bom.length > 0) {
                classTag = '<span class="tag tag-assy">ASSY</span>';
            }
            
            rows.push({
                part: parentPart,
                qty: usage.qty,
                depth,
                nodeKey,
                isExpanded,
                hasParents,
                classTag
            });
            
            // Recursively get parents if expanded
            if (isExpanded && hasParents) {
                rows = rows.concat(buildWhereUsedTree(parentPart.id, depth + 1, new Set(visited)));
            }
        });
        
        return rows;
    };
    
    const treeData = buildWhereUsedTree(selectedPart.id);
    
    // Calculate stats
    const directParents = whereUsed.length;
    const allParents = new Set();
    const collectAllParents = (partId, visited = new Set()) => {
        if (visited.has(partId)) return;
        visited.add(partId);
        Parts.getWhereUsed(partId).forEach(u => {
            allParents.add(u.part.id);
            collectAllParents(u.part.id, visited);
        });
    };
    collectAllParents(selectedPart.id);
    
    // Count how many products this part ultimately ends up in
    const productsContaining = [...allParents].filter(id => {
        const p = Parts.getById(id);
        return p && p.isProduct;
    }).length;
    
    container.innerHTML = `
        <div class="page-header">
            <div>
                <h1 class="page-title">Where Used</h1>
                <p class="page-subtitle">${Utils.escapeHtml(selectedPart.partNumber)} - ${Utils.escapeHtml(selectedPart.name)}</p>
            </div>
            <div class="page-actions">
                <button class="btn" onclick="expandAllWhereUsed()">➕ Expand All</button>
                <button class="btn" onclick="collapseAllWhereUsed()">➖ Collapse All</button>
            </div>
        </div>
        
        ${selectorHtml}
        
        <div class="stats-grid" style="max-width:800px;margin-bottom:24px">
            <div class="stat-card"><div class="stat-label">Direct Parents</div><div class="stat-value">${directParents}</div></div>
            <div class="stat-card"><div class="stat-label">All Ancestors</div><div class="stat-value">${allParents.size}</div></div>
            <div class="stat-card"><div class="stat-label">In Products</div><div class="stat-value accent">${productsContaining}</div></div>
        </div>
        
        ${whereUsed.length === 0 ? `
            <div class="empty-state">
                <div class="empty-state-icon">🔗</div>
                <div class="empty-state-title">Not Used Anywhere</div>
                <p style="color:var(--text-muted)">This part is not currently used in any assemblies or products</p>
            </div>
        ` : `
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🔗 Usage Hierarchy (Bottom-Up)</span>
                    <span style="color:var(--text-muted);font-size:12px">Click arrows to expand/collapse parent assemblies</span>
                </div>
                <div class="table-container" style="max-height:calc(100vh - 480px);overflow:auto">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:50%">Used In (Parent Assembly)</th>
                                <th>Class</th>
                                <th>Qty</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${treeData.map(row => `
                                <tr style="background:${row.depth > 0 ? `rgba(163, 113, 247, ${0.03 * row.depth})` : 'transparent'}">
                                    <td>
                                        <div style="display:flex;align-items:center;padding-left:${row.depth * 24}px">
                                            ${row.hasParents ? `
                                                <button class="btn btn-sm btn-icon" style="margin-right:8px;width:24px;height:24px;padding:0" 
                                                        onclick="toggleWhereUsedNode('${row.nodeKey}')">
                                                    ${row.isExpanded ? '▼' : '▶'}
                                                </button>
                                            ` : '<span style="width:32px;display:inline-block"></span>'}
                                            <span class="mono" style="color:var(--accent)">${Utils.escapeHtml(row.part.partNumber)}</span>
                                            <span style="margin-left:8px;color:var(--text-secondary)">${Utils.escapeHtml(row.part.name)}</span>
                                        </div>
                                    </td>
                                    <td>${row.classTag}</td>
                                    <td class="mono">${row.qty}</td>
                                    <td><span class="tag tag-${row.part.status}">${row.part.status}</span></td>
                                    <td class="nowrap">
                                        <button class="btn btn-sm btn-icon" onclick="selectBomPart('${row.part.id}');showView('bom')" title="View BOM">🌳</button>
                                        <button class="btn btn-sm btn-icon" onclick="showModal('editPart', '${row.part.id}')" title="Edit">✏️</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `}
    `;
}

// Where Used tree expand/collapse functions
function toggleWhereUsedNode(nodeKey) {
    if (DB.expandedWhereUsedNodes.has(nodeKey)) {
        DB.expandedWhereUsedNodes.delete(nodeKey);
    } else {
        DB.expandedWhereUsedNodes.add(nodeKey);
    }
    renderWhereUsedView();
}

function expandAllWhereUsed() {
    if (!DB.selectedBomPart) return;
    
    const expandRecursively = (partId, visited = new Set()) => {
        if (visited.has(partId)) return;
        visited.add(partId);
        
        Parts.getWhereUsed(partId).forEach(usage => {
            const nodeKey = `${partId}-${usage.part.id}`;
            DB.expandedWhereUsedNodes.add(nodeKey);
            expandRecursively(usage.part.id, visited);
        });
    };
    
    expandRecursively(DB.selectedBomPart);
    renderWhereUsedView();
}

function collapseAllWhereUsed() {
    DB.expandedWhereUsedNodes.clear();
    renderWhereUsedView();
}

function toggleConflictExpand(conflictId) {
    const body = document.getElementById(`conflict-body-${conflictId}`);
    if (body) {
        body.style.display = body.style.display === 'none' ? 'block' : 'none';
    }
}

function showMergeModal(part1Id, part2Id) {
    const part1 = Parts.getById(part1Id);
    const part2 = Parts.getById(part2Id);
    if (!part1 || !part2) return;
    
    const modalHtml = `
        <div class="modal-backdrop" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:600px">
                <div class="modal-header">
                    <h2 class="modal-title">🔀 Merge Parts</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <p style="margin-bottom:16px;color:var(--text-secondary)">
                        Select which part to keep. The other part will be deleted, and all BOM references will be updated to point to the kept part.
                    </p>
                    
                    <div style="display:flex;flex-direction:column;gap:12px">
                        <label class="conflict-part" style="cursor:pointer;border:2px solid transparent" onclick="selectMergeTarget('${part1Id}')">
                            <input type="radio" name="mergeTarget" value="${part1Id}" style="margin-right:12px">
                            <div style="flex:1">
                                <div style="font-weight:600">${Utils.escapeHtml(part1.partNumber)}</div>
                                <div style="font-size:13px">${Utils.escapeHtml(part1.name)}</div>
                                <div style="font-size:12px;color:var(--text-muted)">
                                    Status: ${part1.status} · BOM: ${part1.bom?.length || 0} items · Used in: ${Parts.getWhereUsed(part1Id).length} assemblies
                                </div>
                            </div>
                        </label>
                        
                        <label class="conflict-part" style="cursor:pointer;border:2px solid transparent" onclick="selectMergeTarget('${part2Id}')">
                            <input type="radio" name="mergeTarget" value="${part2Id}" style="margin-right:12px">
                            <div style="flex:1">
                                <div style="font-weight:600">${Utils.escapeHtml(part2.partNumber)}</div>
                                <div style="font-size:13px">${Utils.escapeHtml(part2.name)}</div>
                                <div style="font-size:12px;color:var(--text-muted)">
                                    Status: ${part2.status} · BOM: ${part2.bom?.length || 0} items · Used in: ${Parts.getWhereUsed(part2Id).length} assemblies
                                </div>
                            </div>
                        </label>
                    </div>
                    
                    <div style="margin-top:16px;padding:12px;background:rgba(255,170,0,0.1);border-radius:6px;font-size:13px;color:var(--warning)">
                        ⚠️ This action cannot be undone. The deleted part's BOM (if any) will be merged into the kept part.
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" id="mergeBtn" disabled onclick="executeMerge('${part1Id}', '${part2Id}')">
                        🔀 Merge Parts
                    </button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('modalContainer').innerHTML = modalHtml;
}

function selectMergeTarget(partId) {
    document.getElementById('mergeBtn').disabled = false;
}

function executeMerge(part1Id, part2Id) {
    const selected = document.querySelector('input[name="mergeTarget"]:checked');
    if (!selected) return;
    
    const keepId = selected.value;
    const removeId = keepId === part1Id ? part2Id : part1Id;
    
    ConflictDetection.mergeParts(keepId, removeId);
    closeModal();
    showToast('Parts merged successfully', 'success');
    renderConflictsView();
}

                                        <div style="font-size:12px;color:var(--text-muted)">

                                    </div>

}

function showVersionDetailModal(partId, versionId) {
    const part = Parts.getById(partId);
    if (!part) return;
    
    const version = part.versionHistory?.find(v => v.id === versionId);
    if (!version) return;
    
    const bomHtml = version.data.bom?.length > 0 ? `
        <div style="margin-top:16px">
            <h4 style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Bill of Materials (${version.data.bom.length} items)</h4>
            <div style="max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:6px">
                <table style="font-size:12px">
                    <thead>
                        <tr><th>Part Number</th><th>Name</th><th>Qty</th></tr>
                    </thead>
                    <tbody>
                        ${version.data.bom.map(item => {
                            const childPart = Parts.getById(item.partId);
                            return `
                                <tr>
                                    <td class="mono">${Utils.escapeHtml(childPart?.partNumber || item.partId)}</td>
                                    <td>${Utils.escapeHtml(childPart?.name || '-')}</td>
                                    <td>${item.qty}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    ` : '<p style="color:var(--text-muted);margin-top:16px">No BOM items in this version</p>';
    
    const modalHtml = `
        <div class="modal-backdrop" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:600px">
                <div class="modal-header">
                    <h2 class="modal-title">📋 Version Details - Rev ${version.version}</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div style="display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:13px">
                        <div style="color:var(--text-muted)">Version:</div>
                        <div>Rev ${version.version}</div>
                        
                        <div style="color:var(--text-muted)">Saved:</div>
                        <div>${Utils.formatDateTime(version.timestamp)}</div>
                        
                        <div style="color:var(--text-muted)">Status:</div>
                        <div><span class="tag tag-${version.status}">${version.status}</span></div>
                        
                        <div style="color:var(--text-muted)">Name:</div>
                        <div>${Utils.escapeHtml(version.data.name)}</div>
                        
                        <div style="color:var(--text-muted)">Type:</div>
                        <div>${version.data.type || '-'}</div>
                        
                        <div style="color:var(--text-muted)">Category:</div>
                        <div>${version.data.category || '-'}</div>
                        
                        <div style="color:var(--text-muted)">Legacy PN:</div>
                        <div>${Utils.escapeHtml(version.data.legacyPartNumber || '-')}</div>
                        
                        <div style="color:var(--text-muted)">Cost:</div>
                        <div>${Utils.formatCurrency(version.data.costAvg || version.data.cost || 0)}</div>
                        
                        ${version.note ? `
                            <div style="color:var(--text-muted)">Note:</div>
                            <div>${Utils.escapeHtml(version.note)}</div>
                        ` : ''}
                    </div>
                    
                    ${bomHtml}
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeModal()">Close</button>
                    <button class="btn btn-warning" onclick="if(confirm('Restore to this version?')) { VersionHistory.restoreVersion('${partId}', ${versionId}); closeModal(); }">
                        ⏪ Restore This Version
                    </button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('modalContainer').innerHTML = modalHtml;
}

function showVersionCompareModal(partId, versionId1, versionId2) {
    const diff = VersionHistory.compareVersions(partId, versionId1, versionId2);
    if (!diff) return;
    
    const part = Parts.getById(partId);
    
    // Build changes HTML
    let changesHtml = '';
    if (diff.changes.length === 0 && 
        diff.bomChanges.added.length === 0 && 
        diff.bomChanges.removed.length === 0 && 
        diff.bomChanges.qtyChanged.length === 0) {
        changesHtml = '<div style="text-align:center;color:var(--text-muted);padding:24px">No differences found</div>';
    } else {
        // Field changes
        if (diff.changes.length > 0) {
            changesHtml += `
                <div style="margin-bottom:16px">
                    <h4 style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Field Changes</h4>
                    ${diff.changes.map(c => `
                        <div style="padding:8px 12px;background:var(--bg-tertiary);border-radius:4px;margin-bottom:4px;font-size:13px">
                            <strong>${c.field}:</strong>
                            <span class="diff-remove">${Utils.escapeHtml(String(c.old || '-'))}</span>
                            →
                            <span class="diff-add">${Utils.escapeHtml(String(c.new || '-'))}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // BOM changes
        if (diff.bomChanges.added.length > 0 || diff.bomChanges.removed.length > 0 || diff.bomChanges.qtyChanged.length > 0) {
            changesHtml += `
                <div>
                    <h4 style="font-size:13px;color:var(--text-muted);margin-bottom:8px">BOM Changes</h4>
                    ${diff.bomChanges.added.map(item => `
                        <div style="padding:8px 12px;background:rgba(63,185,80,0.1);border-left:3px solid var(--success);border-radius:4px;margin-bottom:4px;font-size:13px">
                            <span class="diff-add">+ Added:</span> ${Utils.escapeHtml(item.partNumber)} (Qty: ${item.qty})
                        </div>
                    `).join('')}
                    ${diff.bomChanges.removed.map(item => `
                        <div style="padding:8px 12px;background:rgba(248,81,73,0.1);border-left:3px solid var(--error);border-radius:4px;margin-bottom:4px;font-size:13px">
                            <span class="diff-remove">- Removed:</span> ${Utils.escapeHtml(item.partNumber)} (Qty: ${item.qty})
                        </div>
                    `).join('')}
                    ${diff.bomChanges.qtyChanged.map(item => `
                        <div style="padding:8px 12px;background:rgba(210,153,34,0.1);border-left:3px solid var(--warning);border-radius:4px;margin-bottom:4px;font-size:13px">
                            <span class="diff-change">~ Qty Changed:</span> ${Utils.escapeHtml(item.partNumber)}: ${item.oldQty} → ${item.newQty}
                        </div>
                    `).join('')}
                </div>
            `;
        }
    }
    
    const modalHtml = `
        <div class="modal-backdrop" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:700px">
                <div class="modal-header">
                    <h2 class="modal-title">🔍 Version Comparison - ${Utils.escapeHtml(part?.partNumber || '')}</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <!-- Version Headers -->
                    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:16px;margin-bottom:16px;text-align:center">
                        <div style="padding:12px;background:var(--bg-tertiary);border-radius:6px">
                            <div style="font-weight:600">Rev ${diff.v1.version}</div>
                            <div style="font-size:12px;color:var(--text-muted)">${Utils.formatDateTime(diff.v1.timestamp)}</div>
                            <span class="tag tag-${diff.v1.status}" style="margin-top:4px">${diff.v1.status}</span>
                        </div>
                        <div style="display:flex;align-items:center;font-size:24px;color:var(--text-muted)">→</div>
                        <div style="padding:12px;background:var(--bg-tertiary);border-radius:6px">
                            <div style="font-weight:600">${versionId2 === 'current' ? 'Current' : 'Rev ' + diff.v2.version}</div>
                            <div style="font-size:12px;color:var(--text-muted)">${Utils.formatDateTime(diff.v2.timestamp)}</div>
                            <span class="tag tag-${diff.v2.status}" style="margin-top:4px">${diff.v2.status}</span>
                        </div>
                    </div>
                    
                    <!-- Changes -->
                    <div style="max-height:400px;overflow:auto">
                        ${changesHtml}
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('modalContainer').innerHTML = modalHtml;
}

function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('modalContainer').innerHTML = '';
    renderAll();
}

function switchEditTab(tab, btn) {
    document.querySelectorAll('[id^="editTab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById('editTab-' + tab).classList.remove('hidden');
    btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function switchImportTab(tab, btn) {
    document.querySelectorAll('[id^="importTab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById('importTab-' + tab).classList.remove('hidden');
    btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function saveNewPart() {
    const name = document.getElementById('newPartName').value.trim();
    if (!name) { alert('Name is required'); return; }
    
    Parts.create({
        partNumber: document.getElementById('newPartNumber').value.trim(),
        name: name,
        type: document.getElementById('newPartType').value,
        category: document.getElementById('newPartCategory').value.trim(),
        costLow: document.getElementById('newCostLow').value,
        costHigh: document.getElementById('newCostHigh').value,
        costAvg: document.getElementById('newCostAvg').value,
        notes: document.getElementById('newPartNotes').value.trim(),
        isProduct: document.getElementById('newIsProduct').checked
    });
    
    closeModal();
}

function saveEditPart(id) {
    const part = Parts.getById(id);
    const newStatus = document.getElementById('editPartStatus').value;
    const newRevision = document.getElementById('editPartRevision').value.trim();
    
    // Check if status is changing to released or revision is changing
    const isReleasing = part && part.status !== 'released' && newStatus === 'released';
    const revisionChanged = part && part.revision !== newRevision;
    
    // Save current version before making changes if releasing or revision changed
    if (part && (isReleasing || revisionChanged)) {
        VersionHistory.saveVersion(id, isReleasing ? 'Before release' : `Before revision change to ${newRevision}`);
    }
    
    Parts.update(id, {
        // partNumber is readonly - don't update it
        legacyPartNumber: document.getElementById('editLegacyPartNumber').value.trim() || null,
        name: document.getElementById('editPartName').value.trim(),
        type: document.getElementById('editPartType').value,
        category: document.getElementById('editPartCategory').value.trim(),
        status: newStatus,
        revision: newRevision,
        notes: document.getElementById('editPartNotes').value.trim(),
        isProduct: document.getElementById('editIsProduct').checked,
        cost: parseFloat(document.getElementById('editCost').value) || 0,
        costedDate: document.getElementById('editCostedDate').value || null,
        costLow: parseFloat(document.getElementById('editCostLow').value) || 0,
        costHigh: parseFloat(document.getElementById('editCostHigh').value) || 0,
        costAvg: parseFloat(document.getElementById('editCostAvg').value) || 0
    });
    
    // Save new version after release
    if (isReleasing) {
        VersionHistory.saveVersion(id, `Released as Rev ${newRevision}`);
        showToast(`${part.partNumber} released and version saved`, 'success');
    }
    
    closeModal();
}

function showAddToBomModal(parentId) {
    const parent = Parts.getById(parentId);
    if (!parent) return;
    
    // Store parent ID for later use
    window._addToBomParentId = parentId;
    window._addToBomSearchTerm = '';
    window._addToBomMode = 'existing'; // 'existing' or 'new'
    
    renderAddToBomModal();
}

function renderAddToBomModal() {
    const parentId = window._addToBomParentId;
    const parent = Parts.getById(parentId);
    const searchTerm = window._addToBomSearchTerm || '';
    const mode = window._addToBomMode || 'existing';
    
    // Get parts not already in BOM
    const existingIds = new Set((parent.bom || []).map(b => b.partId));
    let available = DB.parts.filter(p => p.id !== parentId && !existingIds.has(p.id));
    
    // Filter by search term
    if (searchTerm) {
        const term = searchTerm.toLowerCase();
        available = available.filter(p => 
            p.partNumber.toLowerCase().includes(term) ||
            p.name.toLowerCase().includes(term) ||
            (p.legacyPartNumber || '').toLowerCase().includes(term)
        );
    }
    
    // Limit display for performance
    const displayParts = available.slice(0, 50);
    const hasMore = available.length > 50;
    
    const existingPartHtml = `
        <div class="form-group">
            <label class="form-label">Search Parts</label>
            <div class="search-box" style="margin-bottom:12px">

                <input type="text" class="form-input" id="addToBomSearch" 
                    placeholder="Search by part number, name, or legacy PN..." 
                    value="${Utils.escapeHtml(searchTerm)}"
                    oninput="window._addToBomSearchTerm = this.value; renderAddToBomModal()">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Select Part <span style="color:var(--text-muted);font-weight:normal">(${available.length} available)</span></label>

                ${displayParts.length === 0 
                    ? `<div style="padding:24px;text-align:center;color:var(--text-muted)">
                        ${searchTerm ? 'No parts match your search' : 'No parts available to add'}
                        <br><br>
                        <button class="btn btn-sm" onclick="window._addToBomMode='new';renderAddToBomModal()">➕ Create New Part</button>
                       </div>`
                    : displayParts.map(p => {
                        const hasBom = p.bom && p.bom.length > 0;
                        return `
                        <div class="selectable-part-row" onclick="selectPartForBom('${p.id}')" data-id="${p.id}">
                            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
                                ${hasBom ? '<span class="tag tag-assy" style="padding:1px 4px;font-size:9px">ASSY</span>' : ''}

                                <span style="color:var(--text-muted);font-size:11px">${p.legacyPartNumber ? '(' + Utils.escapeHtml(p.legacyPartNumber) + ')' : ''}</span>
                            </div>
                            <div style="flex:2;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${Utils.escapeHtml(p.name)}</div>
                            <div class="mono" style="font-size:12px;color:var(--success)">${Utils.formatCurrency(Parts.getEffectiveCost(p))}</div>
                        </div>
                    `}).join('')}

            </div>
        </div>
        
        <div class="form-group" id="selectedPartInfo" style="display:none;background:var(--bg-tertiary);padding:12px;border-radius:6px;margin-top:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div style="font-weight:600" id="selectedPartName">-</div>
                    <div style="font-size:12px;color:var(--text-muted)" id="selectedPartNumber">-</div>
                </div>
                <button class="btn btn-sm" onclick="clearPartSelection()">✕ Clear</button>

        </div>

            <label class="form-label">Quantity</label>
            <input type="number" min="1" class="form-input" id="addToBomQty" value="1" style="width:100px">
        </div>
    `;
    
    const newPartHtml = `
        <div style="background:var(--bg-tertiary);padding:12px;border-radius:6px;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:18px">✨</span>
                <div>
                    <div style="font-weight:600">Create New Part</div>
                    <div style="font-size:12px;color:var(--text-muted)">This will add a new part to the database AND to this BOM</div>
                </div>
            </div>
        </div>

            <div class="form-group">
                <label class="form-label">Part Number <span style="color:var(--text-muted);font-weight:normal">(optional)</span></label>

        <div class="form-group">
            <label class="form-label required">Name / Description</label>
            <input type="text" class="form-input" id="newPartName" placeholder="Part name or description">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Type</label>
                <select class="form-select" id="newPartType">
                    <option value="PP">PP - Purchased Part</option>
                    <option value="SA">SA - Sub-Assembly</option>
                    <option value="MD">MD - Manufactured</option>
                    <option value="HS">HS - Hardware/Standard</option>
                    <option value="UP">UP - Unassigned</option>

                <label class="form-label">Quantity in BOM</label>

            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Notes <span style="color:var(--text-muted);font-weight:normal">(optional)</span></label>
            <input type="text" class="form-input" id="newPartNotes" placeholder="Any additional notes">
        </div>
    `;
    
    const html = `
        <div class="modal-backdrop" onclick="closeAddToBomModal(event)" style="z-index:1001">
            <div class="modal modal-lg" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h2 class="modal-title">Add Part to: ${Utils.escapeHtml(parent.partNumber)}</h2>
                    <button class="modal-close" onclick="closeAddToBomModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="tabs" style="margin-bottom:16px">
                        <button class="tab ${mode === 'existing' ? 'active' : ''}" onclick="window._addToBomMode='existing';renderAddToBomModal()">

                </div>
                <div class="modal-footer">
