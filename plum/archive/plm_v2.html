<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLM - Product Lifecycle Management</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-elevated: #30363d;
            --border: #30363d;
            --border-light: #484f58;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --accent-emphasis: #1f6feb;
            --success: #3fb950;
            --warning: #d29922;
            --error: #f85149;
            --purple: #a371f7;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* ===== HEADER ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 24px; }
        .logo { font-size: 18px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .logo-icon { background: var(--accent); color: var(--bg-primary); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
        
        .product-selector { display: flex; align-items: center; gap: 8px; }
        .product-selector label { color: var(--text-secondary); font-size: 13px; }
        .product-selector select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 200px;
        }
        
        .header-right { display: flex; align-items: center; gap: 12px; }
        .save-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.saved { background: var(--success); }
        .status-dot.unsaved { background: var(--warning); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-elevated); border-color: var(--border-light); }
        .btn-primary { background: var(--accent-emphasis); border-color: var(--accent-emphasis); color: white; }
        .btn-primary:hover { background: var(--accent); }
        .btn-success { background: var(--success); border-color: var(--success); color: var(--bg-primary); }
        .btn-danger { background: transparent; border-color: var(--error); color: var(--error); }
        .btn-danger:hover { background: var(--error); color: white; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        .btn-icon { padding: 6px; min-width: 32px; justify-content: center; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        
        /* ===== LAYOUT ===== */
        .main { display: flex; height: calc(100vh - 60px); }
        
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .nav { padding: 16px 0; flex: 1; overflow-y: auto; }
        .nav-section { margin-bottom: 24px; }
        .nav-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); padding: 0 16px; margin-bottom: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
        }
        .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .nav-item.active { background: rgba(88, 166, 255, 0.1); color: var(--accent); border-right: 2px solid var(--accent); }
        .nav-badge { margin-left: auto; background: var(--bg-elevated); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .nav-item.active .nav-badge { background: var(--accent); color: var(--bg-primary); }
        
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        
        .content { flex: 1; overflow: auto; padding: 24px; }
        
        /* ===== VIEWS ===== */
        .view { display: none; }
        .view.active { display: block; }
        
        .page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
        .page-title { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .page-subtitle { color: var(--text-secondary); font-size: 14px; }
        .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        
        /* ===== CARDS ===== */
        .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .card-title { font-weight: 600; font-size: 14px; }
        .card-body { padding: 16px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-value { font-size: 28px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; }
        .stat-value.accent { color: var(--accent); }
        
        /* ===== TABLES ===== */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; background: var(--bg-tertiary); color: var(--text-secondary); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover td { background: var(--bg-tertiary); }
        .mono { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .nowrap { white-space: nowrap; }
        
        /* ===== TAGS ===== */
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .tag-draft { background: rgba(210, 153, 34, 0.2); color: var(--warning); }
        .tag-released { background: rgba(63, 185, 80, 0.2); color: var(--success); }
        .tag-obsolete { background: rgba(248, 81, 73, 0.2); color: var(--error); }
        .tag-type { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
        .tag-product { background: rgba(163, 113, 247, 0.2); color: var(--purple); }
        .tag-assy { background: rgba(163, 113, 247, 0.15); color: var(--purple); }
        .tag-category { background: var(--bg-elevated); color: var(--text-secondary); }
        
        .rev-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; background: var(--bg-elevated); color: var(--text-secondary); }
        
        /* ===== FORMS ===== */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-label.required::after { content: ' *'; color: var(--error); }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
        .form-textarea { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        /* ===== SEARCH & FILTERS ===== */
        .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .search-box { position: relative; flex: 1; min-width: 200px; max-width: 300px; }
        .search-box input { width: 100%; padding: 8px 12px 8px 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-tertiary); color: var(--text-primary); font-size: 13px; }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        
        .filter-group { display: flex; gap: 4px; }
        .filter-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); transition: all 0.15s; }
        .filter-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg-primary); }
        
        /* ===== BOM TREE ===== */
        .bom-tree { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .bom-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); transition: background 0.15s; }
        .bom-row:last-child { border-bottom: none; }
        .bom-row:hover { background: var(--bg-tertiary); }
        .bom-row.level-0 { background: var(--bg-tertiary); font-weight: 600; }
        .bom-row.level-1 { padding-left: 32px; }
        .bom-row.level-2 { padding-left: 56px; }
        .bom-row.level-3 { padding-left: 80px; }
        .bom-row.level-4 { padding-left: 104px; }
        .bom-expand { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); font-size: 12px; border-radius: 4px; }
        .bom-expand:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .bom-expand.empty { visibility: hidden; }
        .bom-info { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
        .bom-pn { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; color: var(--accent); min-width: 100px; }
        .bom-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bom-qty { font-family: 'SF Mono', Monaco, monospace; font-size: 13px; min-width: 50px; text-align: center; }
        .bom-cost { font-family: 'SF Mono', Monaco, monospace; font-size: 13px; min-width: 80px; text-align: right; }
        .bom-ext { font-family: 'SF Mono', Monaco, monospace; font-size: 13px; min-width: 80px; text-align: right; color: var(--success); }
        
        /* ===== MODALS ===== */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-lg { max-width: 800px; }
        .modal-xl { max-width: 1000px; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
        .modal-close:hover { color: var(--text-primary); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
        
        /* ===== WHERE USED ===== */
        .where-used-link { color: var(--purple); cursor: pointer; font-size: 12px; }
        .where-used-link:hover { text-decoration: underline; }
        
        /* ===== UPLOAD ===== */
        .upload-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(88, 166, 255, 0.05); }
        .upload-zone-icon { font-size: 40px; margin-bottom: 12px; }
        .upload-zone-text { color: var(--text-secondary); margin-bottom: 4px; }
        .upload-zone-hint { font-size: 12px; color: var(--text-muted); }
        
        /* ===== TABS ===== */
        .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .tab { padding: 8px 16px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-secondary); background: transparent; border: none; }
        .tab:hover { color: var(--text-primary); background: var(--bg-tertiary); }
        .tab.active { color: var(--accent); background: var(--bg-tertiary); }
        
        /* ===== EMPTY STATE ===== */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        
        /* ===== UTILITIES ===== */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .ml-auto { margin-left: auto; }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">P</div>
                <span>PLM</span>
            </div>
            <div class="product-selector">
                <label>Product:</label>
                <select id="productSelect" onchange="selectProduct(this.value)">
                    <option value="">All Parts (No Product)</option>
                </select>
            </div>
        </div>
        <div class="header-right">
            <div class="save-status">
                <span class="status-dot" id="saveStatusDot"></span>
                <span id="saveStatusText">Saved</span>
            </div>
            <div id="dbFolderStatus" class="hidden" style="font-size:12px;color:var(--text-secondary);margin-right:8px">
                📂 <span id="dbFolderName">-</span>
            </div>
            <button class="btn btn-sm btn-primary" onclick="openDbFolder()" title="Open database folder">📂 Open db/</button>
            <button class="btn btn-sm" id="saveToFolderBtn" onclick="saveToFolder()" disabled title="Save to opened folder">💾 Save</button>
            <button class="btn btn-sm" onclick="showModal('import')">📥 Import</button>
            <button class="btn btn-sm" onclick="showModal('export')">📤 Export</button>
        </div>
    </header>
    
    <!-- MAIN -->
    <div class="main">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="nav">
                <div class="nav-section">
                    <div class="nav-title">Overview</div>
                    <div class="nav-item active" data-view="dashboard">📊 Dashboard</div>
                </div>
                <div class="nav-section">
                    <div class="nav-title">Data</div>
                    <div class="nav-item" data-view="parts">📦 Parts Database <span class="nav-badge" id="navPartsCount">0</span></div>
                    <div class="nav-item" data-view="products">🏭 Products <span class="nav-badge" id="navProductsCount">0</span></div>
                </div>
                <div class="nav-section">
                    <div class="nav-title">Views</div>
                    <div class="nav-item" data-view="bom">🌳 Indented BOM</div>
                    <div class="nav-item" data-view="flatbom">📋 Flat BOM</div>
                    <div class="nav-item" data-view="whereused">🔗 Where Used</div>
                </div>
                <div class="nav-section">
                    <div class="nav-title">History</div>
                    <div class="nav-item" data-view="history">📜 Change Log <span class="nav-badge" id="navHistoryCount">0</span></div>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="btn" style="width:100%" onclick="showModal('newPart')">➕ New Part</button>
            </div>
        </nav>
        
        <!-- CONTENT -->
        <main class="content" id="contentArea">
            <!-- Dashboard View -->
            <div id="view-dashboard" class="view active"></div>
            
            <!-- Parts Database View -->
            <div id="view-parts" class="view"></div>
            
            <!-- Products View -->
            <div id="view-products" class="view"></div>
            
            <!-- Indented BOM View -->
            <div id="view-bom" class="view"></div>
            
            <!-- Flat BOM View -->
            <div id="view-flatbom" class="view"></div>
            
            <!-- Where Used View -->
            <div id="view-whereused" class="view"></div>
            
            <!-- History View -->
            <div id="view-history" class="view"></div>
        </main>
    </div>
    
    <!-- MODAL CONTAINER -->
    <div id="modalContainer"></div>

<script>
// =============================================================================
// STATE MANAGEMENT
// =============================================================================
const DB = {
    parts: [],          // All parts (including assemblies and products)
    history: [],        // Change log
    selectedProduct: null,
    searchTerm: '',
    filters: {
        status: 'all',
        type: 'all',
        category: 'all'
    },
    expandedBomNodes: new Set(),
    selectedParts: new Set(),
    hasUnsavedChanges: false
};

let idCounter = 1;

// =============================================================================
// UTILITIES
// =============================================================================
const Utils = {
    generateId: () => `P${String(idCounter++).padStart(5, '0')}`,
    
    formatCurrency: (v) => {
        if (v == null || isNaN(v)) return '-';
        return '$' + Number(v).toFixed(2);
    },
    
    formatDate: (d) => d ? new Date(d).toLocaleDateString() : '-',
    formatDateTime: (d) => d ? new Date(d).toLocaleString() : '-',
    
    escapeHtml: (s) => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') : '',
    
    debounce: (fn, delay) => {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), delay);
        };
    }
};

// =============================================================================
// PART OPERATIONS
// =============================================================================
const Parts = {
    create(data) {
        const now = new Date().toISOString();
        const part = {
            id: data.id || Utils.generateId(),
            partNumber: data.partNumber || '',
            name: data.name || 'New Part',
            type: data.type || 'PP',
            category: data.category || '',
            revision: data.revision || 'A',
            status: data.status || 'draft',
            
            // Cost - released
            cost: Number(data.cost) || 0,
            costedDate: data.costedDate || null,
            
            // Cost - development
            costLow: Number(data.costLow) || 0,
            costHigh: Number(data.costHigh) || 0,
            costAvg: Number(data.costAvg) || 0,
            
            // Metadata
            notes: data.notes || '',
            
            // BOM
            bom: data.bom || [],
            
            // Flags
            isProduct: data.isProduct || false,
            
            // Timestamps
            created: data.created || now,
            modified: data.modified || now
        };
        
        if (!part.partNumber) part.partNumber = part.id;
        
        DB.parts.push(part);
        History.add('create', 'part', part.id, `Created: ${part.partNumber} - ${part.name}`);
        markUnsaved();
        return part;
    },
    
    update(id, changes) {
        const part = DB.parts.find(p => p.id === id);
        if (!part) return null;
        
        const oldData = JSON.parse(JSON.stringify(part));
        Object.assign(part, changes, { modified: new Date().toISOString() });
        
        History.add('update', 'part', id, `Updated: ${part.partNumber}`, oldData);
        markUnsaved();
        return part;
    },
    
    delete(id) {
        const idx = DB.parts.findIndex(p => p.id === id);
        if (idx === -1) return false;
        
        const part = DB.parts[idx];
        History.add('delete', 'part', id, `Deleted: ${part.partNumber} - ${part.name}`, part);
        DB.parts.splice(idx, 1);
        markUnsaved();
        return true;
    },
    
    getById(id) {
        return DB.parts.find(p => p.id === id);
    },
    
    getByPartNumber(pn) {
        return DB.parts.find(p => p.partNumber === pn);
    },
    
    getProducts() {
        return DB.parts.filter(p => p.isProduct);
    },
    
    getAssemblies() {
        return DB.parts.filter(p => p.bom && p.bom.length > 0);
    },
    
    hasChildren(id) {
        const part = this.getById(id);
        return part && part.bom && part.bom.length > 0;
    },
    
    // Get effective cost (released cost or avg dev cost)
    getEffectiveCost(part) {
        if (part.status === 'released' && part.cost > 0) return part.cost;
        if (part.costAvg > 0) return part.costAvg;
        return 0;
    },
    
    // Calculate rolled-up cost for an assembly
    getRolledUpCost(partId, visitedIds = new Set()) {
        if (visitedIds.has(partId)) return 0; // Prevent infinite loops
        visitedIds.add(partId);
        
        const part = this.getById(partId);
        if (!part) return 0;
        
        if (!part.bom || part.bom.length === 0) {
            return this.getEffectiveCost(part);
        }
        
        let total = 0;
        for (const item of part.bom) {
            const childCost = this.getRolledUpCost(item.partId, new Set(visitedIds));
            total += childCost * item.qty;
        }
        return total;
    },
    
    // Get where used (which parts contain this part in their BOM)
    getWhereUsed(partId) {
        const results = [];
        for (const part of DB.parts) {
            if (part.bom) {
                const found = part.bom.find(b => b.partId === partId);
                if (found) {
                    results.push({
                        part: part,
                        qty: found.qty
                    });
                }
            }
        }
        return results;
    },
    
    // Add part to BOM
    addToBom(parentId, childId, qty = 1) {
        const parent = this.getById(parentId);
        if (!parent) return false;
        
        if (!parent.bom) parent.bom = [];
        
        const existing = parent.bom.find(b => b.partId === childId);
        if (existing) {
            existing.qty += qty;
        } else {
            parent.bom.push({ partId: childId, qty });
        }
        
        parent.modified = new Date().toISOString();
        History.add('update', 'part', parentId, `Added to BOM: ${this.getById(childId)?.partNumber || childId}`);
        markUnsaved();
        return true;
    },
    
    // Remove from BOM
    removeFromBom(parentId, childId) {
        const parent = this.getById(parentId);
        if (!parent || !parent.bom) return false;
        
        const idx = parent.bom.findIndex(b => b.partId === childId);
        if (idx === -1) return false;
        
        parent.bom.splice(idx, 1);
        parent.modified = new Date().toISOString();
        History.add('update', 'part', parentId, `Removed from BOM: ${this.getById(childId)?.partNumber || childId}`);
        markUnsaved();
        return true;
    },
    
    // Update BOM quantity
    updateBomQty(parentId, childId, qty) {
        const parent = this.getById(parentId);
        if (!parent || !parent.bom) return false;
        
        const item = parent.bom.find(b => b.partId === childId);
        if (!item) return false;
        
        item.qty = Math.max(1, parseInt(qty) || 1);
        parent.modified = new Date().toISOString();
        markUnsaved();
        return true;
    },
    
    // Generate flat BOM for a part
    generateFlatBom(partId, parentQty = 1, results = [], visitedIds = new Set()) {
        if (visitedIds.has(partId)) return results;
        visitedIds.add(partId);
        
        const part = this.getById(partId);
        if (!part) return results;
        
        if (!part.bom || part.bom.length === 0) {
            // Leaf part - add to results
            const existing = results.find(r => r.partId === partId);
            if (existing) {
                existing.qty += parentQty;
            } else {
                results.push({
                    partId: partId,
                    partNumber: part.partNumber,
                    name: part.name,
                    type: part.type,
                    qty: parentQty,
                    cost: this.getEffectiveCost(part)
                });
            }
        } else {
            // Assembly - recurse into children
            for (const item of part.bom) {
                this.generateFlatBom(item.partId, parentQty * item.qty, results, new Set(visitedIds));
            }
        }
        
        return results;
    }
};

// =============================================================================
// HISTORY
// =============================================================================
const History = {
    add(action, type, itemId, description, oldValue = null) {
        DB.history.unshift({
            id: Date.now(),
            timestamp: new Date().toISOString(),
            action,
            type,
            itemId,
            description,
            oldValue
        });
        
        // Keep only last 500 entries
        if (DB.history.length > 500) {
            DB.history = DB.history.slice(0, 500);
        }
    },
    
    clear() {
        if (!confirm('Clear all history?')) return;
        DB.history = [];
        markUnsaved();
        renderAll();
    }
};

// =============================================================================
// PERSISTENCE
// =============================================================================
function markUnsaved() {
    DB.hasUnsavedChanges = true;
    document.getElementById('saveStatusDot').className = 'status-dot unsaved';
    document.getElementById('saveStatusText').textContent = 'Unsaved';
}

function markSaved() {
    DB.hasUnsavedChanges = false;
    document.getElementById('saveStatusDot').className = 'status-dot saved';
    document.getElementById('saveStatusText').textContent = 'Saved';
}

function saveToStorage() {
    const data = {
        parts: DB.parts,
        history: DB.history,
        idCounter: idCounter,
        savedAt: new Date().toISOString()
    };
    localStorage.setItem('plmData', JSON.stringify(data));
    markSaved();
}

function loadFromStorage() {
    const saved = localStorage.getItem('plmData');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            DB.parts = data.parts || [];
            DB.history = data.history || [];
            idCounter = data.idCounter || 1;
            markSaved();
            return true;
        } catch (e) {
            console.error('Failed to load from storage:', e);
        }
    }
    return false;
}

// =============================================================================
// IMPORT / EXPORT
// =============================================================================
const ImportExport = {
    parseFile(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const wb = XLSX.read(e.target.result, { type: 'array' });
                callback(wb);
            } catch (err) {
                alert('Error reading file: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    },
    
    importParts(file, sheetName = null) {
        this.parseFile(file, (wb) => {
            const sheet = sheetName ? wb.Sheets[sheetName] : wb.Sheets[wb.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(sheet);
            
            let imported = 0;
            for (const row of data) {
                const partNumber = row.Part_Number || row.PartNumber || row.partNumber || row.part_number || '';
                const name = row.Name || row.Description || row.name || row.description || '';
                
                if (!partNumber && !name) continue;
                
                // Check for existing
                const existing = Parts.getByPartNumber(partNumber);
                if (existing) {
                    // Update existing
                    Parts.update(existing.id, {
                        name: name || existing.name,
                        type: row.Type || row.type || row.Part_Type || existing.type,
                        category: row.Category || row.category || row.Region || existing.category,
                        costHigh: Number(row.Cost_High || row.costHigh) || existing.costHigh,
                        costLow: Number(row.Cost_Low || row.costLow) || existing.costLow,
                        costAvg: Number(row.Cost_Avg || row.costAvg || row.Cost || row.cost) || existing.costAvg,
                        notes: row.Notes || row.notes || existing.notes
                    });
                } else {
                    // Create new
                    Parts.create({
                        partNumber: partNumber,
                        name: name || partNumber,
                        type: row.Type || row.type || row.Part_Type || 'PP',
                        category: row.Category || row.category || row.Region || '',
                        costHigh: Number(row.Cost_High || row.costHigh) || 0,
                        costLow: Number(row.Cost_Low || row.costLow) || 0,
                        costAvg: Number(row.Cost_Avg || row.costAvg || row.Cost || row.cost) || 0,
                        notes: row.Notes || row.notes || '',
                        isProduct: (row.Is_Product || row.isProduct || '').toString().toLowerCase() === 'true'
                    });
                    imported++;
                }
            }
            
            renderAll();
            alert(`Imported ${imported} new parts`);
        });
    },
    
    importBoms(file) {
        this.parseFile(file, (wb) => {
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(sheet);
            
            let added = 0;
            for (const row of data) {
                const parentPN = row.Assembly_Name || row.Parent || row.parent || '';
                const childPN = row.Part_Number || row.Child || row.child || '';
                const qty = Number(row.Qty || row.qty || row.Quantity || 1);
                
                if (!parentPN || !childPN) continue;
                
                // Find or create parent
                let parent = Parts.getByPartNumber(parentPN);
                if (!parent) {
                    parent = Parts.create({ partNumber: parentPN, name: parentPN });
                }
                
                // Find or create child
                let child = Parts.getByPartNumber(childPN);
                if (!child) {
                    const desc = row.Part_Description || row.Description || childPN;
                    child = Parts.create({ partNumber: childPN, name: desc });
                }
                
                // Add to BOM
                Parts.addToBom(parent.id, child.id, qty);
                added++;
            }
            
            renderAll();
            alert(`Added ${added} BOM relationships`);
        });
    },
    
    exportAll() {
        const wb = XLSX.utils.book_new();
        
        // Parts sheet
        const partsData = DB.parts.map(p => ({
            Part_Number: p.partNumber,
            Name: p.name,
            Type: p.type,
            Category: p.category,
            Revision: p.revision,
            Status: p.status,
            Cost: p.cost,
            Costed_Date: p.costedDate,
            Cost_Low: p.costLow,
            Cost_High: p.costHigh,
            Cost_Avg: p.costAvg,
            Is_Product: p.isProduct,
            Has_BOM: (p.bom && p.bom.length > 0),
            Notes: p.notes,
            Created: p.created,
            Modified: p.modified
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(partsData), 'Parts');
        
        // BOMs sheet
        const bomData = [];
        for (const part of DB.parts) {
            if (part.bom && part.bom.length > 0) {
                for (const item of part.bom) {
                    const child = Parts.getById(item.partId);
                    bomData.push({
                        Parent_PN: part.partNumber,
                        Parent_Name: part.name,
                        Child_PN: child?.partNumber || item.partId,
                        Child_Name: child?.name || '',
                        Qty: item.qty
                    });
                }
            }
        }
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bomData), 'BOMs');
        
        // Products sheet
        const productsData = Parts.getProducts().map(p => ({
            Part_Number: p.partNumber,
            Name: p.name,
            Revision: p.revision,
            Status: p.status,
            Total_Cost: Parts.getRolledUpCost(p.id)
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productsData), 'Products');
        
        XLSX.writeFile(wb, `PLM_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
    },
    
    exportProductBom(productId) {
        const product = Parts.getById(productId);
        if (!product) return;
        
        const wb = XLSX.utils.book_new();
        
        // Indented BOM
        const indented = [];
        const addToIndented = (partId, level = 0, parentQty = 1) => {
            const part = Parts.getById(partId);
            if (!part) return;
            
            indented.push({
                Level: level,
                Part_Number: part.partNumber,
                Name: part.name,
                Type: part.type,
                Qty: parentQty,
                Unit_Cost: Parts.getEffectiveCost(part),
                Extended_Cost: Parts.getEffectiveCost(part) * parentQty
            });
            
            if (part.bom) {
                for (const item of part.bom) {
                    addToIndented(item.partId, level + 1, item.qty * parentQty);
                }
            }
        };
        addToIndented(productId);
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(indented), 'Indented_BOM');
        
        // Flat BOM
        const flatBom = Parts.generateFlatBom(productId);
        const flatData = flatBom.map(item => ({
            Part_Number: item.partNumber,
            Name: item.name,
            Type: item.type,
            Total_Qty: item.qty,
            Unit_Cost: item.cost,
            Extended_Cost: item.qty * item.cost
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flatData), 'Flat_BOM');
        
        XLSX.writeFile(wb, `${product.partNumber}_BOM.xlsx`);
    }
};

// =============================================================================
// FILE SYSTEM ACCESS API
// =============================================================================
const FileSystem = {
    directoryHandle: null,
    
    isSupported() {
        return 'showDirectoryPicker' in window;
    },
    
    async openFolder() {
        if (!this.isSupported()) {
            alert('File System Access not supported in this browser. Use Chrome or Edge.');
            return false;
        }
        
        try {
            this.directoryHandle = await window.showDirectoryPicker({
                mode: 'readwrite'
            });
            
            document.getElementById('dbFolderStatus').classList.remove('hidden');
            document.getElementById('dbFolderName').textContent = this.directoryHandle.name;
            document.getElementById('saveToFolderBtn').disabled = false;
            
            // Try to load files from the folder
            await this.loadFromFolder();
            return true;
        } catch (e) {
            if (e.name !== 'AbortError') {
                console.error('Error opening folder:', e);
                alert('Error opening folder: ' + e.message);
            }
            return false;
        }
    },
    
    async loadFromFolder() {
        if (!this.directoryHandle) return;
        
        let partsLoaded = 0;
        let bomsLoaded = 0;
        
        try {
            // Look for parts file
            for await (const entry of this.directoryHandle.values()) {
                if (entry.kind === 'file') {
                    const name = entry.name.toLowerCase();
                    
                    if (name.includes('part') && (name.endsWith('.csv') || name.endsWith('.xlsx') || name.endsWith('.xls'))) {
                        const file = await entry.getFile();
                        partsLoaded = await this.importPartsFile(file);
                    }
                    else if ((name.includes('bom') || name.includes('assembly')) && (name.endsWith('.csv') || name.endsWith('.xlsx') || name.endsWith('.xls'))) {
                        const file = await entry.getFile();
                        bomsLoaded = await this.importBomsFile(file);
                    }
                }
            }
            
            renderAll();
            
            if (partsLoaded > 0 || bomsLoaded > 0) {
                alert(`Loaded from ${this.directoryHandle.name}:\n• ${partsLoaded} parts\n• ${bomsLoaded} BOM relationships`);
            } else {
                alert(`No data files found in ${this.directoryHandle.name}.\n\nLooking for files with "part" or "bom" in the name (.csv, .xlsx, .xls)`);
            }
        } catch (e) {
            console.error('Error loading from folder:', e);
            alert('Error loading files: ' + e.message);
        }
    },
    
    async importPartsFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(sheet);
                    
                    let count = 0;
                    for (const row of data) {
                        const partNumber = row.Part_Number || row.PartNumber || row.partNumber || row.part_number || '';
                        const name = row.Name || row.Description || row.name || row.description || '';
                        
                        if (!partNumber && !name) continue;
                        
                        const existing = Parts.getByPartNumber(partNumber);
                        if (existing) {
                            Parts.update(existing.id, {
                                name: name || existing.name,
                                type: row.Type || row.type || row.Part_Type || existing.type,
                                category: row.Category || row.category || row.Region || existing.category,
                                costHigh: Number(row.Cost_High || row.costHigh) || existing.costHigh,
                                costLow: Number(row.Cost_Low || row.costLow) || existing.costLow,
                                costAvg: Number(row.Cost_Avg || row.costAvg || row.Cost || row.cost) || existing.costAvg,
                                notes: row.Notes || row.notes || existing.notes,
                                isProduct: (row.Is_Product || row.isProduct || '').toString().toLowerCase() === 'true' || existing.isProduct
                            });
                        } else {
                            Parts.create({
                                partNumber,
                                name: name || partNumber,
                                type: row.Type || row.type || row.Part_Type || 'PP',
                                category: row.Category || row.category || row.Region || '',
                                costHigh: Number(row.Cost_High || row.costHigh) || 0,
                                costLow: Number(row.Cost_Low || row.costLow) || 0,
                                costAvg: Number(row.Cost_Avg || row.costAvg || row.Cost || row.cost) || 0,
                                notes: row.Notes || row.notes || '',
                                isProduct: (row.Is_Product || row.isProduct || '').toString().toLowerCase() === 'true'
                            });
                            count++;
                        }
                    }
                    resolve(count);
                } catch (err) {
                    console.error('Error parsing parts file:', err);
                    resolve(0);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    },
    
    async importBomsFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(sheet);
                    
                    let count = 0;
                    for (const row of data) {
                        const parentPN = row.Assembly_Name || row.Parent || row.parent || row.Parent_PN || '';
                        const childPN = row.Part_Number || row.Child || row.child || row.Child_PN || '';
                        const qty = Number(row.Qty || row.qty || row.Quantity || 1);
                        
                        if (!parentPN || !childPN) continue;
                        
                        let parent = Parts.getByPartNumber(parentPN);
                        if (!parent) {
                            parent = Parts.create({ partNumber: parentPN, name: parentPN });
                        }
                        
                        let child = Parts.getByPartNumber(childPN);
                        if (!child) {
                            const desc = row.Part_Description || row.Description || row.Child_Name || childPN;
                            const cost = Number(row.Unit_Cost || row.Cost || 0);
                            child = Parts.create({ partNumber: childPN, name: desc, costAvg: cost });
                        }
                        
                        // Check if already in BOM
                        if (!parent.bom) parent.bom = [];
                        const existing = parent.bom.find(b => b.partId === child.id);
                        if (!existing) {
                            parent.bom.push({ partId: child.id, qty });
                            count++;
                        }
                    }
                    resolve(count);
                } catch (err) {
                    console.error('Error parsing BOMs file:', err);
                    resolve(0);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    },
    
    async saveToFolder() {
        if (!this.directoryHandle) {
            alert('No folder opened. Click "Open db/" first.');
            return;
        }
        
        try {
            // Save parts.csv
            const partsData = DB.parts.map(p => ({
                Part_Number: p.partNumber,
                Name: p.name,
                Type: p.type,
                Category: p.category,
                Revision: p.revision,
                Status: p.status,
                Cost: p.cost,
                Costed_Date: p.costedDate || '',
                Cost_Low: p.costLow,
                Cost_High: p.costHigh,
                Cost_Avg: p.costAvg,
                Is_Product: p.isProduct,
                Notes: p.notes
            }));
            
            const partsWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(partsWb, XLSX.utils.json_to_sheet(partsData), 'Parts');
            const partsBuffer = XLSX.write(partsWb, { type: 'array', bookType: 'csv' });
            
            const partsFile = await this.directoryHandle.getFileHandle('parts.csv', { create: true });
            const partsWritable = await partsFile.createWritable();
            await partsWritable.write(partsBuffer);
            await partsWritable.close();
            
            // Save boms.csv
            const bomData = [];
            for (const part of DB.parts) {
                if (part.bom && part.bom.length > 0) {
                    for (const item of part.bom) {
                        const child = Parts.getById(item.partId);
                        bomData.push({
                            Parent_PN: part.partNumber,
                            Parent_Name: part.name,
                            Child_PN: child?.partNumber || item.partId,
                            Child_Name: child?.name || '',
                            Qty: item.qty,
                            Unit_Cost: child ? Parts.getEffectiveCost(child) : 0
                        });
                    }
                }
            }
            
            const bomWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(bomWb, XLSX.utils.json_to_sheet(bomData), 'BOMs');
            const bomBuffer = XLSX.write(bomWb, { type: 'array', bookType: 'csv' });
            
            const bomFile = await this.directoryHandle.getFileHandle('boms.csv', { create: true });
            const bomWritable = await bomFile.createWritable();
            await bomWritable.write(bomBuffer);
            await bomWritable.close();
            
            // Also save to localStorage as backup
            saveToStorage();
            
            markSaved();
            alert(`Saved to ${this.directoryHandle.name}/:\n• parts.csv (${DB.parts.length} parts)\n• boms.csv (${bomData.length} relationships)`);
            
        } catch (e) {
            console.error('Error saving to folder:', e);
            alert('Error saving: ' + e.message);
        }
    }
};

// Indented BOM View
function renderBomView() {
    const container = document.getElementById('view-bom');
    
    if (!DB.selectedProduct) {
        container.innerHTML = `
            <div class="page-header">
                <div>
                    <h1 class="page-title">Indented BOM</h1>
                    <p class="page-subtitle">Select a product to view its BOM structure</p>
                </div>
            </div>
            <div class="empty-state">
                <div class="empty-state-icon">🌳</div>
                <div class="empty-state-title">No Product Selected</div>
                <p style="color:var(--text-muted)">Use the product selector in the header</p>
            </div>
        `;
        return;
    }
    
    const product = Parts.getById(DB.selectedProduct);
    if (!product) return;
    
    const totalCost = Parts.getRolledUpCost(product.id);
    
    // Build tree HTML
    function buildTreeHtml(partId, level = 0, parentQty = 1) {
        const part = Parts.getById(partId);
        if (!part) return '';
        
        const hasBom = part.bom && part.bom.length > 0;
        const nodeKey = `${partId}-${level}`;
        const isExpanded = DB.expandedBomNodes.has(nodeKey) || level === 0;
        const cost = Parts.getEffectiveCost(part);
        const extCost = cost * parentQty;
        
        let html = `
            <div class="bom-row level-${Math.min(level, 4)}">
                <div class="bom-expand ${hasBom ? '' : 'empty'}" onclick="toggleBomNode('${nodeKey}')">${hasBom ? (isExpanded ? '▼' : '▶') : ''}</div>
                <div class="bom-info">
                    <span class="bom-pn">${Utils.escapeHtml(part.partNumber)}</span>
                    <span class="bom-name">${Utils.escapeHtml(part.name)}</span>
                    <span class="tag tag-type" style="font-size:10px">${part.type}</span>
                    ${part.isProduct ? '<span class="tag tag-product" style="font-size:10px">PRODUCT</span>' : ''}
                </div>
                <div class="bom-qty">${parentQty}</div>
                <div class="bom-cost">${Utils.formatCurrency(cost)}</div>
                <div class="bom-ext">${Utils.formatCurrency(extCost)}</div>
            </div>
        `;
        
        if (hasBom && isExpanded) {
            for (const item of part.bom) {
                html += buildTreeHtml(item.partId, level + 1, item.qty);
            }
        }
        
        return html;
    }
    
    container.innerHTML = `
        <div class="page-header">
            <div>
                <h1 class="page-title">Indented BOM</h1>
                <p class="page-subtitle">${Utils.escapeHtml(product.partNumber)} - ${Utils.escapeHtml(product.name)}</p>
            </div>
            <div class="page-actions">
                <button class="btn" onclick="expandAllBom()">➕ Expand All</button>
                <button class="btn" onclick="collapseAllBom()">➖ Collapse All</button>
                <button class="btn btn-primary" onclick="ImportExport.exportProductBom('${product.id}')">📤 Export</button>
            </div>
        </div>
        
        <div class="stats-grid" style="max-width:600px">
            <div class="stat-card"><div class="stat-label">Total Rolled-Up Cost</div><div class="stat-value accent">${Utils.formatCurrency(totalCost)}</div></div>
        </div>
        
        <div class="bom-tree">
            <div class="bom-row" style="background:var(--bg-tertiary);font-weight:600;font-size:12px;color:var(--text-secondary)">
                <div class="bom-expand"></div>
                <div class="bom-info">PART NUMBER / NAME</div>
                <div class="bom-qty">QTY</div>
                <div class="bom-cost">UNIT</div>
                <div class="bom-ext">EXT</div>
            </div>
            ${buildTreeHtml(product.id)}
        </div>
    `;
}

function toggleBomNode(nodeKey) {
    if (DB.expandedBomNodes.has(nodeKey)) {
        DB.expandedBomNodes.delete(nodeKey);
    } else {
        DB.expandedBomNodes.add(nodeKey);
    }
    renderBomView();
}

function expandAllBom() {
    // Expand all nodes
    function expandAll(partId, level = 0) {
        const part = Parts.getById(partId);
        if (!part) return;
        DB.expandedBomNodes.add(`${partId}-${level}`);
        if (part.bom) {
            for (const item of part.bom) {
                expandAll(item.partId, level + 1);
            }
        }
    }
    if (DB.selectedProduct) expandAll(DB.selectedProduct);
    renderBomView();
}

function collapseAllBom() {
    DB.expandedBomNodes.clear();
    renderBomView();
}
