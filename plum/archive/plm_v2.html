        `;
    }
    
    else if (type === 'editPart' && data) {
        const part = Parts.getById(data);
        if (!part) return;
        
        const whereUsed = Parts.getWhereUsed(part.id);
        
        html = `
            <div class="modal-backdrop" onclick="closeModal(event)">
                <div class="modal modal-lg" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h2 class="modal-title">Edit: ${Utils.escapeHtml(part.partNumber)}</h2>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="tabs">
                            <button class="tab active" onclick="switchEditTab('details', this)">Details</button>
                            <button class="tab" onclick="switchEditTab('costs', this)">Costs</button>
                            <button class="tab" onclick="switchEditTab('whereused', this)">Where Used (${whereUsed.length})</button>
                        </div>
                        
                        <div id="editTab-details">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Part Number</label>
                                    <input class="form-input" id="editPartNumber" value="${Utils.escapeHtml(part.partNumber)}">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Name</label>
                                    <input class="form-input" id="editPartName" value="${Utils.escapeHtml(part.name)}">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Type</label>
                                    <select class="form-select" id="editPartType">
                                        ${['PP','SA','MD','UP','HS'].map(t => `<option value="${t}" ${part.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Category</label>
                                    <input class="form-input" id="editPartCategory" value="${Utils.escapeHtml(part.category || '')}">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Status</label>
                                    <select class="form-select" id="editPartStatus">
                                        <option value="draft" ${part.status === 'draft' ? 'selected' : ''}>Draft</option>
                                        <option value="released" ${part.status === 'released' ? 'selected' : ''}>Released</option>
                                        <option value="obsolete" ${part.status === 'obsolete' ? 'selected' : ''}>Obsolete</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Revision</label>
                                    <input class="form-input" id="editPartRevision" value="${Utils.escapeHtml(part.revision)}">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Notes</label>
                                <textarea class="form-textarea" id="editPartNotes">${Utils.escapeHtml(part.notes || '')}</textarea>
                            </div>
                            <div class="form-group">
                                <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                                    <input type="checkbox" id="editIsProduct" ${part.isProduct ? 'checked' : ''}>
                                    <span>This is a Product</span>
                                </label>
                            </div>
                        </div>
                        
                        <div id="editTab-costs" class="hidden">
                            <div class="card" style="margin-bottom:16px;background:var(--bg-tertiary)">
                                <div class="card-body">
                                    <h4 style="margin-bottom:12px">Released Cost</h4>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label class="form-label">Cost</label>
                                            <input type="number" step="0.01" class="form-input" id="editCost" value="${part.cost || ''}">
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label">Costed Date</label>
                                            <input type="date" class="form-input" id="editCostedDate" value="${part.costedDate ? part.costedDate.slice(0,10) : ''}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <h4 style="margin-bottom:12px">Development Estimates</h4>
                            <div class="form-row-3">
                                <div class="form-group">
                                    <label class="form-label">Cost Low</label>
                                    <input type="number" step="0.01" class="form-input" id="editCostLow" value="${part.costLow || ''}">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Cost High</label>
                                    <input type="number" step="0.01" class="form-input" id="editCostHigh" value="${part.costHigh || ''}">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Cost Avg</label>
                                    <input type="number" step="0.01" class="form-input" id="editCostAvg" value="${part.costAvg || ''}">
                                </div>
                            </div>
                        </div>
                        
                        <div id="editTab-whereused" class="hidden">
                            ${whereUsed.length === 0 
                                ? '<div class="empty-state" style="padding:40px"><div class="empty-state-icon">🔗</div><div class="empty-state-title">Not used in any assemblies</div></div>'
                                : `<table>
                                    <thead><tr><th>Assembly</th><th>Name</th><th>Qty</th></tr></thead>
                                    <tbody>
                                        ${whereUsed.map(w => `
                                            <tr>
                                                <td class="mono" style="color:var(--accent)">${Utils.escapeHtml(w.part.partNumber)}</td>
                                                <td>${Utils.escapeHtml(w.part.name)}</td>
                                                <td class="mono">${w.qty}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>`
                            }
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="closeModal()">Cancel</button>
                        <button class="btn btn-primary" onclick="saveEditPart('${part.id}')">💾 Save</button>
                    </div>
                </div>
            </div>
        `;
    }
    
    else if (type === 'bomEditor' && data) {
        const part = Parts.getById(data);
        if (!part) return;
        
        const bomItems = (part.bom || []).map(item => {
            const child = Parts.getById(item.partId);
            return { ...item, child };
        });
        
        html = `
            <div class="modal-backdrop" onclick="closeModal(event)">
                <div class="modal modal-lg" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h2 class="modal-title">BOM Editor: ${Utils.escapeHtml(part.partNumber)}</h2>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                            <span style="color:var(--text-secondary)">${bomItems.length} parts in BOM</span>
                            <button class="btn btn-primary btn-sm" onclick="showAddToBomModal('${part.id}')">➕ Add Part</button>
                        </div>
                        
                        <div class="table-container" style="max-height:400px;overflow:auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Part Number</th>
                                        <th>Name</th>
                                        <th style="width:80px">Qty</th>
                                        <th>Unit Cost</th>
                                        <th>Extended</th>
                                        <th style="width:60px"></th>
                                    </tr>
                                </thead>
                                <tbody id="bomEditorBody">
                                    ${bomItems.map(item => `
                                        <tr>
                                            <td class="mono" style="color:var(--accent)">${item.child ? Utils.escapeHtml(item.child.partNumber) : item.partId}</td>
                                            <td>${item.child ? Utils.escapeHtml(item.child.name) : '-'}</td>
                                            <td><input type="number" min="1" class="form-input" style="width:60px;padding:4px 8px" value="${item.qty}" onchange="Parts.updateBomQty('${part.id}', '${item.partId}', this.value);renderAll()"></td>
                                            <td class="mono">${item.child ? Utils.formatCurrency(Parts.getEffectiveCost(item.child)) : '-'}</td>
                                            <td class="mono" style="color:var(--success)">${item.child ? Utils.formatCurrency(Parts.getEffectiveCost(item.child) * item.qty) : '-'}</td>
                                            <td><button class="btn btn-sm btn-danger btn-icon" onclick="Parts.removeFromBom('${part.id}', '${item.partId}');showModal('bomEditor', '${part.id}')"">✕</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            ${bomItems.length === 0 ? '<div class="empty-state" style="padding:40px"><div class="empty-state-title">No parts in BOM</div><p style="color:var(--text-muted)">Click "Add Part" to add components</p></div>' : ''}
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="closeModal()">Done</button>
                    </div>
                </div>
            </div>
        `;
    }
    
    else if (type === 'import') {
        html = `
            <div class="modal-backdrop" onclick="closeModal(event)">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h2 class="modal-title">Import Data</h2>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="tabs">
                            <button class="tab active" onclick="switchImportTab('parts', this)">Parts</button>
                            <button class="tab" onclick="switchImportTab('boms', this)">BOMs</button>
                        </div>
                        
                        <div id="importTab-parts">
                            <p style="color:var(--text-secondary);margin-bottom:16px">Import parts from Excel/CSV. Expected columns: Part_Number, Name/Description, Type, Category, Cost_Low, Cost_High, Cost_Avg</p>
                            <div class="upload-zone" id="partsUploadZone" onclick="document.getElementById('partsFileInput').click()">
                                <div class="upload-zone-icon">📄</div>
                                <div class="upload-zone-text">Drop file here or click to browse</div>
                                <div class="upload-zone-hint">Supports .xlsx, .xls, .csv</div>
                                <input type="file" id="partsFileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handlePartsImport(this.files[0])">
                            </div>
                        </div>
                        
                        <div id="importTab-boms" class="hidden">
                            <p style="color:var(--text-secondary);margin-bottom:16px">Import BOM relationships. Expected columns: Assembly_Name/Parent, Part_Number/Child, Qty</p>
                            <div class="upload-zone" id="bomsUploadZone" onclick="document.getElementById('bomsFileInput').click()">
                                <div class="upload-zone-icon">📋</div>
                                <div class="upload-zone-text">Drop file here or click to browse</div>
                                <input type="file" id="bomsFileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleBomsImport(this.files[0])">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="closeModal()">Close</button>
                    </div>
                </div>
            </div>
        `;
    }
    
    else if (type === 'export') {
        html = `
            <div class="modal-backdrop" onclick="closeModal(event)">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h2 class="modal-title">Export Data</h2>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="card" style="margin-bottom:16px;cursor:pointer" onclick="ImportExport.exportAll();closeModal()">
                            <div class="card-body" style="display:flex;align-items:center;gap:16px">
                                <span style="font-size:32px">📦</span>
                                <div>
                                    <div style="font-weight:600">Export All Data</div>
                                    <div style="font-size:13px;color:var(--text-secondary)">Parts, BOMs, and Products in one Excel file</div>
                                </div>
                            </div>
                        </div>
                        
                        ${DB.selectedProduct ? `
                        <div class="card" style="cursor:pointer" onclick="ImportExport.exportProductBom('${DB.selectedProduct}');closeModal()">
                            <div class="card-body" style="display:flex;align-items:center;gap:16px">
                                <span style="font-size:32px">🌳</span>
                                <div>
                                    <div style="font-weight:600">Export Product BOM</div>
                                    <div style="font-size:13px;color:var(--text-secondary)">Indented and Flat BOM for selected product</div>
                                </div>
                            </div>
                        </div>
                        ` : '<p style="color:var(--text-muted);text-align:center">Select a product to export its BOM</p>'}
                    </div>
                    <div class="modal-footer">
                        <button class="btn" onclick="closeModal()">Close</button>
                    </div>
                </div>
            </div>
        `;
    }
    
    container.innerHTML = html;
    setupUploadZones();
}

function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('modalContainer').innerHTML = '';
    renderAll();
}

function switchEditTab(tab, btn) {
    document.querySelectorAll('[id^="editTab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById('editTab-' + tab).classList.remove('hidden');
    btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function switchImportTab(tab, btn) {
    document.querySelectorAll('[id^="importTab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById('importTab-' + tab).classList.remove('hidden');
    btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function saveNewPart() {
    const name = document.getElementById('newPartName').value.trim();
    if (!name) { alert('Name is required'); return; }
    
    Parts.create({
        partNumber: document.getElementById('newPartNumber').value.trim(),
        name: name,
        type: document.getElementById('newPartType').value,
        category: document.getElementById('newPartCategory').value.trim(),
        costLow: document.getElementById('newCostLow').value,
        costHigh: document.getElementById('newCostHigh').value,
        costAvg: document.getElementById('newCostAvg').value,
        notes: document.getElementById('newPartNotes').value.trim(),
        isProduct: document.getElementById('newIsProduct').checked
    });
    
    closeModal();
}

function saveEditPart(id) {
    Parts.update(id, {
        partNumber: document.getElementById('editPartNumber').value.trim(),
        name: document.getElementById('editPartName').value.trim(),
        type: document.getElementById('editPartType').value,
        category: document.getElementById('editPartCategory').value.trim(),
        status: document.getElementById('editPartStatus').value,
        revision: document.getElementById('editPartRevision').value.trim(),
        notes: document.getElementById('editPartNotes').value.trim(),
        isProduct: document.getElementById('editIsProduct').checked,
        cost: parseFloat(document.getElementById('editCost').value) || 0,
        costedDate: document.getElementById('editCostedDate').value || null,
        costLow: parseFloat(document.getElementById('editCostLow').value) || 0,
        costHigh: parseFloat(document.getElementById('editCostHigh').value) || 0,
        costAvg: parseFloat(document.getElementById('editCostAvg').value) || 0
    });
    
    closeModal();
}

function showAddToBomModal(parentId) {
    const parent = Parts.getById(parentId);
    if (!parent) return;
    
    // Get parts not already in BOM
    const existingIds = new Set((parent.bom || []).map(b => b.partId));
    const available = DB.parts.filter(p => p.id !== parentId && !existingIds.has(p.id));
    
    const html = `
        <div class="modal-backdrop" onclick="closeAddToBomModal(event)" style="z-index:1001">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:500px">
                <div class="modal-header">
                    <h2 class="modal-title">Add Part to BOM</h2>
                    <button class="modal-close" onclick="closeAddToBomModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Select Part</label>
                        <select class="form-select" id="addToBomSelect">
                            <option value="">-- Select a part --</option>
                            ${available.map(p => `<option value="${p.id}">${Utils.escapeHtml(p.partNumber)} - ${Utils.escapeHtml(p.name)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantity</label>
                        <input type="number" min="1" class="form-input" id="addToBomQty" value="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeAddToBomModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="confirmAddToBom('${parentId}')">Add</button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('modalContainer').insertAdjacentHTML('beforeend', html);
}

function closeAddToBomModal(event) {
    if (event && event.target !== event.currentTarget) return;
    const modals = document.querySelectorAll('.modal-backdrop');
    if (modals.length > 1) modals[modals.length - 1].remove();
}

function confirmAddToBom(parentId) {
    const childId = document.getElementById('addToBomSelect').value;
    const qty = parseInt(document.getElementById('addToBomQty').value) || 1;
    
    if (!childId) { alert('Select a part'); return; }
    
    Parts.addToBom(parentId, childId, qty);
    closeAddToBomModal();
    showModal('bomEditor', parentId);
}

function showWhereUsedPopup(partId) {
    const part = Parts.getById(partId);
    const whereUsed = Parts.getWhereUsed(partId);
    
    const html = `
        <div class="modal-backdrop" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()" style="max-width:500px">
                <div class="modal-header">
                    <h2 class="modal-title">Where Used: ${Utils.escapeHtml(part?.partNumber || partId)}</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    ${whereUsed.length === 0 
                        ? '<div class="empty-state" style="padding:40px"><div class="empty-state-title">Not used in any assemblies</div></div>'
                        : `<table>
                            <thead><tr><th>Assembly</th><th>Name</th><th>Qty</th></tr></thead>
                            <tbody>
                                ${whereUsed.map(w => `
                                    <tr style="cursor:pointer" onclick="closeModal();showModal('bomEditor', '${w.part.id}')">
                                        <td class="mono" style="color:var(--accent)">${Utils.escapeHtml(w.part.partNumber)}</td>
                                        <td>${Utils.escapeHtml(w.part.name)}</td>
                                        <td class="mono">${w.qty}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>`
                    }
                </div>
                <div class="modal-footer">
                    <button class="btn" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('modalContainer').innerHTML = html;
}

// =============================================================================
// EVENT HANDLERS
// =============================================================================
function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-view="${viewId}"]`)?.classList.add('active');
}

const handlePartsSearch = Utils.debounce((value) => {
    DB.searchTerm = value;
    renderPartsView();
}, 200);

function setFilter(type, value) {
    DB.filters[type] = value;
    renderPartsView();
}

function toggleSelectAllParts(checked) {
    document.querySelectorAll('.part-cb').forEach(cb => {
        cb.checked = checked;
        if (checked) DB.selectedParts.add(cb.dataset.id);
        else DB.selectedParts.delete(cb.dataset.id);
    });
    renderPartsView();
}

function togglePartSelect(id, checked) {
    if (checked) DB.selectedParts.add(id);
    else DB.selectedParts.delete(id);
    renderPartsView();
}

function batchDeleteParts() {
    if (DB.selectedParts.size === 0) return;
    if (!confirm(`Delete ${DB.selectedParts.size} parts?`)) return;
    
    for (const id of DB.selectedParts) {
        Parts.delete(id);
    }
    DB.selectedParts.clear();
    renderAll();
}

function deletePart(id) {
    const part = Parts.getById(id);
    if (!part) return;
    
    const whereUsed = Parts.getWhereUsed(id);
    if (whereUsed.length > 0) {
        if (!confirm(`This part is used in ${whereUsed.length} assemblies. Delete anyway?`)) return;
    } else {
        if (!confirm(`Delete ${part.partNumber}?`)) return;
    }
    
    Parts.delete(id);
    renderAll();
}

function setupUploadZones() {
    ['partsUploadZone', 'bomsUploadZone'].forEach(id => {
        const zone = document.getElementById(id);
        if (!zone) return;
        
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('dragover'); };
        zone.ondragleave = () => zone.classList.remove('dragover');
        zone.ondrop = (e) => {
            e.preventDefault();
            zone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                if (id === 'partsUploadZone') handlePartsImport(file);
                else handleBomsImport(file);
            }
        };
    });
}

function handlePartsImport(file) {
    if (!file) return;
    ImportExport.importParts(file);
    closeModal();
}

function handleBomsImport(file) {
    if (!file) return;
    ImportExport.importBoms(file);
    closeModal();
}

// =============================================================================
// INITIALIZATION
// =============================================================================
document.addEventListener('DOMContentLoaded', () => {
    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => showView(item.dataset.view));
    });
    
    // Load data from localStorage
    loadFromStorage();
    renderAll();
    
    // Check File System API support
    if (!FileSystem.isSupported()) {
        document.querySelector('[onclick="openDbFolder()"]').title = 'Not supported in this browser';
        document.querySelector('[onclick="openDbFolder()"]').classList.add('btn-disabled');
        console.log('File System Access API not supported - use Chrome or Edge');
    }
    
    // Warn on unsaved changes
    window.addEventListener('beforeunload', (e) => {
        if (DB.hasUnsavedChanges) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
    
    // Auto-save to localStorage every 30 seconds
    setInterval(() => {
        if (DB.hasUnsavedChanges) saveToStorage();
    }, 30000);
});
</script>
</body>
</html>
