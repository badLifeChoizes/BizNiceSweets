name: CI

# Every push and pull request runs the full blocking pipeline (NFR-4, v4.0 Phase 3).
# Jobs are independent (no `needs:`) so one failure never masks another and all run
# in parallel. Secrets here are test-only throwaways — no GitHub repo Secrets required.
on:
  push:
  pull_request:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci reads frontend/.npmrc (legacy-peer-deps=true, D-P1-1) automatically — SC7.
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    # conftest.py connects to the default `postgres` maintenance DB, then
    # CREATE DATABASE "biznice_test" + runs alembic upgrade head itself. So the
    # service just needs to exist with the default DB and matching creds; do NOT
    # set POSTGRES_DB here (conftest force-sets biznice_test).
    services:
      postgres:
        image: postgres:17
        env:
          # The app (and conftest) connect as role `app` (config default). The
          # image creates this superuser + a default `app` DB; the maintenance
          # `postgres` DB still exists for conftest to CREATE biznice_test.
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ci_test_pw
      JWT_SECRET: ci_test_jwt_secret_at_least_32_chars_long
      BNS_ADMIN_PASSWORD: ci_test_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  verify-scripts:
    name: verify-scripts
    runs-on: ubuntu-latest
    # The non-API verify_*.py scripts build their own engine against `biznice`
    # (config default DB) and do NOT self-create or migrate it. So this service
    # creates `biznice` at init (POSTGRES_DB) and the job migrates it (alembic
    # upgrade head) before running the scripts. The 9 *_api.py scripts are
    # excluded (they need a booted uvicorn; ported to the pytest HTTP suite in 2b).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci_test_pw
          POSTGRES_DB: biznice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: biznice
      POSTGRES_PASSWORD: ci_test_pw
      JWT_SECRET: ci_test_jwt_secret_at_least_32_chars_long
      BNS_ADMIN_PASSWORD: ci_test_pw
      # The scripts do `from app...`; the backend root must be importable
      # (their docstrings run them with PYTHONPATH=/app inside the container).
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate biznice to head
        run: python -m alembic upgrade head
      - name: Seed reference data (Chart of Accounts, admin, etc.)
        # The scripts assume the seeds the app runs at lifespan startup (e.g. the
        # GL Chart of Accounts) — alembic migrates schema only. Run them here,
        # idempotently, exactly as app.main's lifespan does.
        run: |
          python - <<'PY'
          import asyncio
          from app.core.db import AsyncSessionLocal
          from app.core.seed import run_seeds

          async def main():
              async with AsyncSessionLocal() as db:
                  await run_seeds(db)

          asyncio.run(main())
          print("seeds applied")
          PY
      - name: Run non-API verify_* scripts
        run: |
          set -e
          for s in scripts/verify_*.py; do
            case "$s" in
              *_api.py) continue ;;
            esac
            echo "== $s =="
            python "$s"
          done
